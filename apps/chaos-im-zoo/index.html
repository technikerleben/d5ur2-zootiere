const app=document.getElementById('app');
let state={};
const shuffle=a=>a.map(v=>({v,k:Math.random()})).sort((a,b)=>a.k-b.k).map(x=>x.v);
function stopVoice(){if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function say(){stopVoice();if(!('speechSynthesis'in window)){document.getElementById('voiceNote').textContent='Dein Browser kann nicht vorlesen. Lies den Text oder bitte dein Partnerkind.';return}const u=new SpeechSynthesisUtterance(current().intro+' '+document.getElementById('readable').innerText);u.lang='de-DE';u.rate=.9;window.speechSynthesis.speak(u)}
function home(){stopVoice();app.innerHTML=`<section class="hero"><span class="tag">Deine 5-Minuten-Mission</span><h1>Rette die<br>Gehegeschilder!</h1><p class="lead">Im Zoo sind die Tafeln durcheinandergeraten. Hilf mit: Finde unpassende Angaben, wähle genaue Wörter und bringe die Sätze in Ordnung.</p><div class="tiles"><div class="tile"><b>1 · Prüfe die Angaben</b>Was gehört auf eine Tafel?</div><div class="tile"><b>2 · Beschreibe genau</b>Welche Wörter passen?</div><div class="tile"><b>3 · Ordne die Sätze</b>So wird ein Text daraus.</div></div><div class="controls"><label>Du spielst <select id="mode"><option value="solo">allein</option><option value="pair">zu zweit</option></select></label><label>Dein Auftrag <select id="focus"><option value="mix">Zoo-Runde · alle drei Aufgaben</option><option value="0">Angaben prüfen · Etappe 1</option><option value="1">Genau formulieren · Etappe 2</option><option value="2">Texte ordnen · Etappe 3</option></select></label></div><p class="muted">Eine Runde: drei Tafeln, etwa fünf Minuten. Du kannst Tipps nutzen und es noch einmal versuchen. Es gibt keinen Countdown.</p><button class="primary" id="start">Mission starten →</button><details><summary>So spielst du zu zweit</summary><p>Ein Kind liest vor und erklärt seine Idee. Das andere bedient das Spiel. Nach jeder reparierten Tafel wechselst du mit deinem Partnerkind.</p></details><p class="muted">Freiwilliges Spiel · Du brauchst keinen Namen einzugeben.</p></section>`;document.getElementById('start').onclick=()=>start(document.getElementById('mode').value,document.getElementById('focus').value)}
function start(mode,focus){stopVoice();state={mode,focus,order:shuffle([0,1,2]),round:0,step:focus==='mix'?0:Number(focus),solved:0,hints:0,ready:false};setup();render()}
function setup(){state.selected=[];state.sequence=[];state.ready=false;state.statementOrder=shuffle([0,1,2,3]);state.wordOrder=shuffle([0,1,2]);state.partOrder=shuffle([0,1,2,3]);if(state.partOrder.every((x,i)=>x===i))state.partOrder.reverse()}
function current(){return animals[state.order[state.round]]}
function render(){const a=current(),s=state.step;app.innerHTML=`<div class="controls"><button id="home">← Startseite</button><span id="roundStatus">Tafel ${state.round+1} von 3 · ${state.solved} Reparaturen geschafft</span></div><div class="progress" role="progressbar" aria-label="Reparierte Aufgaben" aria-valuemin="0" aria-valuemax="${state.focus==='mix'?9:3}" aria-valuenow="${state.solved}"><div style="width:${state.solved/(state.focus==='mix'?9:3)*100}%"></div></div><div class="path">${['Angaben prüfen','Genau formulieren','Text ordnen'].map((t,i)=>`<span class="stop ${s===i?'active':''}">${i+1} · ${t}</span>`).join('')}</div><p id="role">${state.mode==='pair'?`Partnerwechsel: Kind ${state.round%2+1} bedient. Das andere Kind liest und erklärt.`:'Dein Auftrag: Repariere diese Tafel.'}</p><div class="layout"><aside class="panel"><figure><img src="${a.img}" alt="Foto: ${a.name}"><figcaption>${a.credit} · <a href="${a.source}" target="_blank" rel="noopener">Bildquelle</a></figcaption></figure><h2>${a.name}</h2><div class="source"><b>Deine Infokarte</b><p>${a.intro}</p></div></aside><section class="panel" id="readable" aria-labelledby="tasktitle"><span class="tag">Werkstatt für Gehegeschilder</span><h2 id="tasktitle" tabindex="-1">${['Welche zwei Angaben gehören nicht auf die Tafel?','Welche Wörter beschreiben genau?','Baue die Tafel wieder auf.'][s]}</h2><p>${['Wähle genau zwei unpassende Angaben. Nutze die Infokarte.','Wähle die passende Ergänzung. Schreibe sachlich und im Präsens.','Tippe die Sätze in der passenden Reihenfolge an: Überblick → Aussehen → Lebensraum → Nahrung.'][s]}</p><div id="task"></div><div class="controls"><button id="check" class="primary">Prüfen</button><button id="hint">Tipp</button><button id="voice">▷ Vorlesen</button></div><p id="voiceNote" class="muted"></p><div id="tip" class="source" hidden></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button id="next" class="primary" hidden>Weiter →</button></section></div>`;
document.getElementById('home').onclick=home;document.getElementById('voice').onclick=say;document.getElementById('check').onclick=check;document.getElementById('hint').onclick=hint;document.getElementById('next').onclick=next;drawTask();document.getElementById('tasktitle').focus()}
function drawTask(){const a=current(),s=state.step,t=document.getElementById('task');if(s===0){t.innerHTML=`<div class="choices">${state.statementOrder.map(i=>`<button class="choice" data-id="${i}" aria-pressed="${state.selected.includes(i)}" ${state.ready?'disabled':''}>${state.selected.includes(i)?'✕ ':''}${a.statements[i]}</button>`).join('')}</div>`}else if(s===1){t.innerHTML=`<p class="source"><em>${a.sentence}</em></p><div class="choices">${state.wordOrder.map(i=>`<button class="choice" data-id="${i}" aria-pressed="${state.selected.includes(i)}" ${state.ready?'disabled':''}>${a.choices[i]}</button>`).join('')}</div>`}else{t.innerHTML=`<div class="ordered" aria-label="Deine Satzfolge">${state.sequence.length?state.sequence.map((i,n)=>`<button data-undo="${i}" ${state.ready?'disabled':''} aria-label="Satz ${n+1} entfernen: ${a.parts[i]}">${n+1}. ${a.parts[i]} ↩</button>`).join(''):'Deine Tafel ist noch leer.'}</div><p class="muted">Tippe einen eingefügten Satz an, um ihn zurückzulegen.</p><div class="choices">${state.partOrder.filter(i=>!state.sequence.includes(i)).map(i=>`<button class="choice" data-id="${i}" ${state.ready?'disabled':''}>${a.parts[i]}</button>`).join('')}</div>`}t.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{if(state.ready)return;const i=Number(b.dataset.id);if(s===2)state.sequence.push(i);else if(s===1)state.selected=[i];else if(state.selected.includes(i))state.selected=state.selected.filter(x=>x!==i);else if(state.selected.length<2)state.selected.push(i);else{feedback('Du hast schon zwei Angaben gewählt. Tippe eine davon an, um sie abzuwählen.');return}drawTask()});t.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{if(state.ready)return;state.sequence=state.sequence.filter(i=>i!==Number(b.dataset.undo));drawTask()})}
function feedback(text,good=false){const f=document.getElementById('feedback');f.textContent=text;f.className='feedback'+(good?' good':'')}
function check(){if(state.ready)return;const a=current(),s=state.step;let good=false;if(s===0){if(state.selected.length!==2){feedback('Wähle genau zwei Angaben aus.');return}good=a.wrong.every(i=>state.selected.includes(i))}if(s===1){if(!state.selected.length){feedback('Wähle zuerst eine Ergänzung aus.');return}good=state.selected[0]===a.answer}if(s===2){if(state.sequence.length!==4){feedback('Setze zuerst alle vier Sätze auf die Tafel.');return}good=state.sequence.every((i,n)=>i===n)}if(!good){feedback(['Prüfe noch einmal: Gilt die Angabe für die Tierart oder ist es eine Meinung oder ein Erlebnis mit einem einzelnen Tier?','Lies die Infokarte. Gesucht sind genaue Merkmale, keine Bewertungen.','Beginne mit dem Tier und seinem Körper. Beschreibe danach das Aussehen. Dann folgen Lebensraum und Nahrung.'][s]);return}state.ready=true;state.solved++;document.getElementById('roundStatus').textContent=`Tafel ${state.round+1} von 3 · ${state.solved} Reparaturen geschafft`;feedback('✓ Repariert! '+[a.why,a.wordwhy,'Deine Tafel ist geordnet: Überblick, Aussehen, Lebensraum und Nahrung.'][s],true);document.getElementById('check').disabled=true;document.getElementById('hint').disabled=true;document.getElementById('next').hidden=false;document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',state.solved);document.querySelector('.progress div').style.width=state.solved/(state.focus==='mix'?9:3)*100+'%';drawTask()}
function hint(){if(state.ready)return;state.hints++;const box=document.getElementById('tip');box.hidden=false;box.textContent=['Tipp: Ein Tiername wie „Otto“, „Kiki“ oder „Mei“ meint ein einzelnes Tier. Wörter wie „toll“ und „niedlich“ zeigen eine Meinung.','Tipp: Frage dich: Was kann ich überprüfen? Die Infokarte hilft dir bei der Auswahl.','Tipp: 1. Tier und Körper · 2. weiteres Körpermerkmal · 3. Wo lebt es? · 4. Was frisst es?'][state.step]}
function next(){if(!state.ready)return;stopVoice();if(state.focus==='mix'&&state.step<2){state.step++;setup();render();return}state.round++;if(state.round===3){finish();return}state.step=state.focus==='mix'?0:Number(state.focus);setup();render()}
function finish(){app.innerHTML=`<section class="hero success"><div class="badge" aria-hidden="true">✓</div><span class="tag">Mission geschafft</span><h1>Die Schilder stehen wieder!</h1><p>Du hast drei Tiertafeln repariert und ${state.solved} Aufgaben gelöst.</p><p class="source">${state.focus==='mix'?'Du hast Sachangaben erkannt, genaue Wörter gewählt und Texte geordnet.':['Du hast Sachangaben von Meinungen und Einzeltier-Angaben unterschieden.','Du hast Tiere mit genauen Wörtern beschrieben.','Du hast Tierbeschreibungen sinnvoll geordnet.'][Number(state.focus)]}</p><p>${state.mode==='pair'?'Erkläre deinem Partnerkind:':'Überlege:'} Worauf achtest du bei deiner nächsten Tierbeschreibung?</p><div class="controls" style="justify-content:center"><button id="again" class="primary">Neue Mission</button><button id="back">Zur Startseite</button></div><p class="muted">Zeit vorbei? Du kannst jetzt wieder an deinem Lernweg arbeiten.</p></section>`;document.getElementById('again').onclick=()=>start(state.mode,state.focus);document.getElementById('back').onclick=home}
window.addEventListener('pagehide',stopVoice);home();
