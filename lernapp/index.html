<script>
(function(){
"use strict";
const D = {"app":{"titel":"Zootiere","kurz":"Zootiere","untertitel":"Deutsch · Jahrgang 5 · Tiere beschreiben"},"start":{"hallo":"Hier übst du, wie man ein Tier sachlich beschreibt. Du lernst in deinem Tempo. Die App ersetzt nicht dein Heft und nicht die Blätter in der Schule.","hinweis_haken":"Deine Häkchen bleiben nur auf diesem Handy. Niemand sonst sieht sie."},"elterninfo":{"titel":"Für Eltern","sprachwahl":"Sprache · Language","sprachen":[{"code":"de","name":"Deutsch","titel":"Für Eltern","absaetze":["Diese App begleitet die Deutsch-Reihe „Zootiere“ in Jahrgang 5. Die Kinder lernen, ein Tier mithilfe von Bild und Interview sachlich und geordnet zu beschreiben.","Die Nutzung ist **freiwillig**. Es gibt keine Noten, keine Punkte und keine Ranglisten.","**Datenschutz:** Es gibt keine Anmeldung, keine Namen und keine Werbung. Die App sendet keine Daten. Häkchen und Notizen werden nur auf diesem Gerät gespeichert. Mit „Alles löschen“ entfernen Sie sie.","**Offline:** Nach dem ersten Öffnen funktioniert die App auch ohne Internet. Sie können sie über das Teilen-Menü des Browsers zum Startbildschirm hinzufügen.","**So können Sie helfen:** Lassen Sie sich von Ihrem Kind ein Tier beschreiben. Fragen Sie nach: „Woher weißt du das? Gilt das für alle Tiere dieser Art?“ Im Bereich „Zuhause“ finden Sie Ideen.","Die Interviews sind ausgedacht. Die Angaben über die Tiere stimmen.","**KI-Hinweis:** Diese App wurde mit Unterstützung künstlicher Intelligenz (KI) programmiert. Die meisten Inhalte sind KI-generierte Texte. Sie wurden von den Lehrkräften geprüft und werden von ihnen verantwortet."]},{"code":"uk","name":"Українська","titel":"Для батьків","absaetze":["Цей застосунок супроводжує цикл уроків німецької мови «Zootiere» (тварини зоопарку) у 5-му класі. Діти вчаться описувати тварину об'єктивно й послідовно за допомогою зображення та інтерв'ю.","Сам застосунок німецькою мовою, тому що діти вивчають німецьку. Ця сторінка пояснює його для батьків.","Користування **добровільне**. Немає оцінок, балів і рейтингів.","**Захист даних:** Немає реєстрації, імен і реклами. Застосунок не надсилає жодних даних. Позначки й нотатки зберігаються лише на цьому пристрої. Ви можете видалити їх кнопкою «Alles löschen» (видалити все).","**Офлайн:** Після першого відкриття застосунок працює і без інтернету. Ви можете додати його на головний екран через меню «Поділитися» у браузері.","**Як ви можете допомогти:** Попросіть дитину описати вам якусь тварину. Запитайте: «Звідки ти це знаєш? Чи це стосується всіх тварин цього виду?» Ідеї ви знайдете в розділі «Zuhause» (вдома).","Інтерв'ю вигадані. Відомості про тварин правдиві.","**Примітка щодо ШІ:** Цей застосунок створено за допомогою штучного інтелекту (ШІ). Більшість матеріалів — це тексти, згенеровані ШІ. Їх перевірили вчителі, які несуть за них відповідальність."],"hinweis_uebersetzung":"Цей переклад також створено за допомогою ШІ, тому він може бути неточним."},{"code":"ar","name":"العربية","titel":"لأولياء الأمور","rtl":true,"absaetze":["يرافق هذا التطبيق وحدة دروس اللغة الألمانية «Zootiere» (حيوانات حديقة الحيوان) في الصف الخامس. يتعلّم الأطفال وصف حيوانٍ وصفًا موضوعيًّا ومرتّبًا بالاستعانة بصورة ومقابلة.","التطبيق نفسه باللغة الألمانية لأن الأطفال يتعلّمون الألمانية. تشرح هذه الصفحة التطبيق لأولياء الأمور.","استخدام التطبيق **اختياري**. لا توجد درجات ولا نقاط ولا ترتيب للتلاميذ.","**حماية البيانات:** لا يوجد تسجيل دخول ولا أسماء ولا إعلانات. لا يرسل التطبيق أي بيانات. تُحفظ العلامات والملاحظات على هذا الجهاز فقط. يمكنكم حذفها بالزر «Alles löschen» (حذف الكل).","**دون اتصال بالإنترنت:** بعد فتح التطبيق مرة واحدة يعمل أيضًا دون إنترنت. يمكنكم إضافته إلى الشاشة الرئيسية من خلال قائمة المشاركة في المتصفح.","**كيف يمكنكم المساعدة:** اطلبوا من طفلكم أن يصف لكم حيوانًا، واسألوه: «كيف تعرف ذلك؟ هل ينطبق هذا على جميع الحيوانات من هذا النوع؟» تجدون أفكارًا في قسم «Zuhause» (في البيت).","المقابلات من نسج الخيال، أما المعلومات عن الحيوانات فهي صحيحة.","**ملاحظة حول الذكاء الاصطناعي:** بُرمج هذا التطبيق بمساعدة الذكاء الاصطناعي. ومعظم المحتويات نصوص أنتجها الذكاء الاصطناعي، وقد راجعها المعلمون وهم يتحمّلون مسؤوليتها."],"hinweis_uebersetzung":"هذه الترجمة أيضًا من إنتاج الذكاء الاصطناعي، وقد تكون غير دقيقة."},{"code":"tr","name":"Türkçe","titel":"Veliler için","absaetze":["Bu uygulama, 5. sınıftaki „Zootiere“ (hayvanat bahçesi hayvanları) Almanca dersi ünitesine eşlik eder. Çocuklar bir resim ve bir röportaj yardımıyla bir hayvanı nesnel ve düzenli bir şekilde betimlemeyi öğrenir.","Uygulamanın kendisi Almancadır, çünkü çocuklar Almanca öğreniyor. Bu sayfa uygulamayı velilere açıklar.","Uygulamanın kullanımı **isteğe bağlıdır**. Not, puan veya sıralama yoktur.","**Veri koruma:** Kayıt, isim veya reklam yoktur. Uygulama hiçbir veri göndermez. İşaretler ve notlar yalnızca bu cihazda kaydedilir. Bunları „Alles löschen“ (hepsini sil) düğmesiyle silebilirsiniz.","**Çevrimdışı:** İlk açılıştan sonra uygulama internet olmadan da çalışır. Tarayıcınızın paylaş menüsü üzerinden ana ekranınıza ekleyebilirsiniz.","**Nasıl yardımcı olabilirsiniz:** Çocuğunuzdan size bir hayvanı anlatmasını isteyin. Şöyle sorun: „Bunu nereden biliyorsun? Bu, bu türdeki bütün hayvanlar için geçerli mi?“ „Zuhause“ (evde) bölümünde fikirler bulabilirsiniz.","Röportajlar uydurmadır. Hayvanlarla ilgili bilgiler doğrudur.","**Yapay zekâ notu:** Bu uygulama yapay zekâ (YZ) desteğiyle programlanmıştır. İçeriklerin çoğu yapay zekâ tarafından üretilmiş metinlerdir. Bu metinler öğretmenler tarafından kontrol edilmiştir ve sorumluluğu öğretmenlere aittir."],"hinweis_uebersetzung":"Bu çeviri de yapay zekâ tarafından üretilmiştir ve tam olarak doğru olmayabilir."},{"code":"en","name":"English","titel":"For parents","absaetze":["This app accompanies the German lessons on „Zootiere“ (zoo animals) in Year 5. The children learn to describe an animal factually and in a clear order, using a picture and an interview.","The app itself is in German because the children are learning German. This page explains it for parents.","Using the app is **voluntary**. There are no grades, no points and no rankings.","**Data protection:** There is no login, no names and no advertising. The app does not send any data. Ticks and notes are stored only on this device. You can remove them with „Alles löschen“ (delete everything).","**Offline:** Once it has been opened, the app also works without internet. You can add it to your home screen via your browser's share menu.","**How you can help:** Ask your child to describe an animal to you. Ask: “How do you know that? Is that true for all animals of this kind?” You will find ideas in the „Zuhause“ (at home) section.","The interviews are made up. The information about the animals is correct.","**Note on AI:** This app was programmed with the support of artificial intelligence (AI). Most of the content consists of AI-generated texts. They have been checked by the teachers, who are responsible for them."],"hinweis_uebersetzung":"This translation was also generated by AI and may be inaccurate."},{"code":"fr","name":"Français","titel":"Pour les parents","absaetze":["Cette application accompagne la séquence d'allemand « Zootiere » (les animaux du zoo) en 5e année (Jahrgang 5). Les enfants apprennent à décrire un animal de manière objective et ordonnée, à l'aide d'une image et d'une interview.","L'application elle-même est en allemand, car les enfants apprennent l'allemand. Cette page l'explique aux parents.","L'utilisation est **facultative**. Il n'y a ni notes, ni points, ni classements.","**Protection des données :** Il n'y a ni inscription, ni noms, ni publicité. L'application n'envoie aucune donnée. Les coches et les notes sont enregistrées uniquement sur cet appareil. Vous pouvez les supprimer avec « Alles löschen » (tout supprimer).","**Hors ligne :** Après la première ouverture, l'application fonctionne aussi sans internet. Vous pouvez l'ajouter à l'écran d'accueil via le menu de partage du navigateur.","**Comment vous pouvez aider :** Demandez à votre enfant de vous décrire un animal. Demandez-lui : « Comment le sais-tu ? Est-ce vrai pour tous les animaux de cette espèce ? » Vous trouverez des idées dans la rubrique « Zuhause » (à la maison).","Les interviews sont inventées. Les informations sur les animaux sont exactes.","**Remarque sur l'IA :** Cette application a été programmée avec l'aide de l'intelligence artificielle (IA). La plupart des contenus sont des textes générés par l'IA. Ils ont été vérifiés par les enseignants, qui en assument la responsabilité."],"hinweis_uebersetzung":"Cette traduction a également été générée par l'IA et peut être imprécise."}]},"stand":"10.10.2026","hinweis_fiktiv":"Das Interview ist ausgedacht. Die Angaben über das Tier stimmen.","weg":[{"id":"e1","titel":"Etappe 1 · Informationen finden und ordnen","text":"Input oder Merkblatt → Pflichtblätter → Gelingensnachweis. Vier von fünf Zielen reichen für die nächste Etappe.","punkte":["Input gehört oder Merkblatt 1 gelesen","Blatt 1 · Welche Beschreibung hilft?","Blatt 2 · Schau genau hin","Blatt 3 · Im Interview suchen","Blatt 4 · Informationen ordnen","Freiwillige Vertiefungen","Gelingensnachweis 1 · Tierdetektiv (4 von 5)"],"wissen":"e1","ueben":1},{"id":"e2","titel":"Etappe 2 · Sachlich und genau formulieren","text":"Input oder Merkblatt → Pflichtblätter → Gelingensnachweis. Vier von fünf Zielen reichen für die nächste Etappe.","punkte":["Input gehört oder Merkblatt 2 gelesen","Blatt 5 · Treffende Wörter","Blatt 6 · Sachliche Sätze","Freiwillige Vertiefungen","Gelingensnachweis 2 · Genaue Sätze (4 von 5)"],"wissen":"e2","ueben":2},{"id":"e3","titel":"Etappe 3 · Eine Tierbeschreibung schreiben und prüfen","text":"Input oder Merkblatt → Pflichtblätter → Gelingensnachweis. Vier von fünf Zielen reichen für die nächste Etappe.","punkte":["Input gehört oder Merkblatt 3 gelesen","Blatt 7 · Dein Schreibplan","Blatt 8 · Deine Tierbeschreibung","Blatt 9 · Prüfen und verbessern","Freiwillige Vertiefungen","Probearbeit geschrieben (4 von 5)","Feedback zur Probearbeit bekommen"],"wissen":"e3","ueben":3},{"id":"wahl","titel":"Wahlzeit","text":"Nach dem Feedback zur Probearbeit entscheidest du, woran du arbeitest. Offene Ziele kommen zuerst.","punkte":["Offene Ziele geübt und noch einmal gezeigt (wenn nötig)","P1 · Unser Tiermagazin","P2 · Welches Tier ist gemeint?","P3 · Zwei Tiere vergleichen","Vertiefungen nachgeholt"],"ueben":"training"},{"id":"training","titel":"Training vor der Klassenarbeit","text":"Du übst noch einmal mit neuen Tieren aus dem Zoo Dortmund.","punkte":["Beispiel · Die Angola-Giraffe","Ü1 · Die Elenantilope","Ü2 · Die Hirschziegenantilope"],"ueben":"training"},{"id":"ka","titel":"Klassenarbeit","text":"Du schreibst die Klassenarbeit an einem von zwei Terminen. Du arbeitest allein. Erlaubt sind die Seite „Das zählt“ und die Hilfeseite.","punkte":["Termin gewählt","Klassenarbeit geschrieben"]}],"wissen":{"etappen":[{"etappe":1,"titel":"Informationen finden und ordnen","ziel":"Ich kann ein Tier genau betrachten und Sachangaben aus Bild und Interview ordnen.","abschnitte":[{"titel":"Finde den Fisch","bild":"aquarium","bloecke":[["Schau genau hin","Im Aquarium schwimmen vier Fische: A, B, C und D."],["Beschreibung 1","*Der Fisch hat einen langen, schmalen Körper. Auf dem Körper sind dunkle Punkte.*"],["Beschreibung 2","*Der Fisch ist schön und schwimmt im Wasser.*"],["Frage","Welche Beschreibung passt nur zu einem Fisch? Zeige den Hinweis, der dir hilft. Mache Beschreibung 2 genauer."],["Gesicherte Antwort","Beschreibung 1 passt nur zu Fisch B: langer, schmaler Körper und dunkle Punkte. Beschreibung 2 passt zu allen Fischen. Genauer ist zum Beispiel: *Der Fisch hat einen runden Körper mit dunklen Streifen.* Das ist Fisch A."]]},{"titel":"Genau statt wertend","bild":null,"bloecke":[["Dein Ziel","Genaue Angaben helfen anderen, sich das Tier vorzustellen."],["Vergleiche","A: *Der Fischotter ist toll. Sein Fell ist schön.*\nB: *Der Fischotter hat einen langen Körper und kurze Beine. Sein Fell ist oben dunkelbraun.*"],["Frage","Welcher Text hilft dir beim Vorstellen? Warum?"],["Gesicherte Antwort","B nennt Körperform, Beine und Fellfarbe. „schön“ und „toll“ sind Meinungen, keine Merkmale."]]},{"titel":"Das zeigt dir das Foto","bild":"fischotter","bloecke":[["Beobachte","Zeige zwei Körperteile. Nenne jeweils ein genaues Merkmal."],["Gesicherte Antwort","An der Schnauze sitzen lange **Tasthaare**. Die Ohren sind klein. Zeige die passenden Bildstellen."],["Grenze des Bildes","**Schwimmhäute** und die gesamte **Körperlänge** erkennst du hier nicht sicher. Erfinde keine verdeckten Merkmale."]]},{"titel":"Das erfährst du im Interview","bild":null,"bloecke":[["So liest du","1. Lies das Interview einmal. Markiere Wörter, die du nicht verstehst.\n2. Kläre sie mit der Wörterhilfe oder frage nach. Rate nicht.\n3. Suche mit Suchwörtern: *leben, fressen, Zentimeter*. Markiere **L** (Lebensraum), **N** (Nahrung), **M** (Maß).\n4. Notiere ein Stichwort und die Zeile."],["Lies gezielt","**Wie groß ist Otto?**\n*Von der Nase bis zum Schwanzansatz waren es 80 Zentimeter. Fischotter sind meistens 60 bis 90 Zentimeter lang, wenn man den Schwanz nicht mitzählt.*"],["Frage","Wie lang sind Fischotter? Zählt der Schwanz dazu? Für wen gelten die 80 Zentimeter?"],["Gesicherte Antwort","Fischotter sind ohne Schwanz etwa 60–90 cm lang. Die 80 cm gelten nur für Otto."],["Mit einem Partner prüfen","Zeige deine Stelle und nenne die Zeile. Passt sie zur Frage? Bei verschiedenen Antworten prüft ihr gemeinsam."]]},{"titel":"Was gehört in die Beschreibung?","bild":null,"bloecke":[["Im Interview","Frau Berger erzählt viel. Nicht alles passt in eine Tierbeschreibung."],["Drei Prüffragen","1. Gilt es für **alle Fischotter**? → **Sachangabe**, passt.\n2. Geht es nur um **Otto** oder den Zoo? → **Einzelfall**, passt nicht.\n3. Sagt jemand, wie er das Tier **findet**? → **Meinung**, passt nicht."],["Frage","Ordne zu: *Fischotter fressen Fische.* · *Otto bekommt einen Eimer voll.* · *Er ist der süßeste Otter!*"],["Gesicherte Antwort","Sachangabe: Fische. Einzelfall: Ottos Eimer. Meinung: „der süßeste Otter“. Nur die Sachangabe passt."]]},{"titel":"Sprachdetektiv","bild":null,"bloecke":[["Vier Wortarten","**Nomen** benennen Tiere und Dinge: *Otter, Fell*. Du schreibst sie groß.\n**Artikel** begleiten Nomen: *der Otter, das Fell*.\n**Verben** sagen, was geschieht oder wie etwas ist: *schwimmt, ist*.\n**Adjektive** beschreiben Merkmale: *braun, dicht*."],["Wörter zerlegen","*der Körper + die Länge = die Körperlänge*\nDas letzte Nomen bestimmt den Artikel."],["Frage","„Der Otter schwimmt.“ Welche Wortarten findest du?"],["Gesicherte Antwort","*Der*: Artikel; *Otter*: Nomen; *schwimmt*: Verb."]]},{"titel":"Informationen ordnen","bild":null,"bloecke":[["Beispiel: nur Sachangaben, geordnet","**Überblick:** Fischotter; ohne Schwanz 60–90 cm\n**Aussehen:** langer, schmaler Körper; kurze Beine; dunkelbraunes Fell oben\n**Lebensraum:** Flüsse und Seen; Ufer mit Verstecken\n**Nahrung:** vor allem Fische; Frösche, Krebse"],["Frage","Wohin gehört „breiter, flacher Kopf“?"],["Gesicherte Antwort","Unter Aussehen. Zeige, ob du die Angabe im Bild oder im Interview gefunden hast."]]}],"abschluss":"Bearbeite Blatt 1–4 mit dem Fischotter-Interview. Vertiefungen sind freiwillig. Danach zeigst du dein Können im Gelingensnachweis. Vier von fünf Zielen reichen für Etappe 2."},{"etappe":2,"titel":"Sachlich und genau formulieren","ziel":"Ich kann genaue Wörter nutzen und verständliche Sätze im Präsens schreiben.","abschnitte":[{"titel":"Genau statt wertend","bild":null,"bloecke":[["Sachlich beschreiben","Beschreibe überprüfbare Merkmale. „schön“ und „süß“ sagen nur, wie jemand etwas findet. Nutze Angaben aus dem Interview."],["Genaue Wörter wählen","Nutze genaue Nomen, Verben und Adjektive.\n*„Das Tier bewegt sich im Wasser.“* wird genauer: *„Der Fischotter schwimmt im Wasser.“*\n*„Sein Fell ist oben dunkelbraun.“* ist ebenfalls genau. Du musst „ist“ nicht immer ersetzen."],["Wörter zusammensetzen","Aus *Fell* und *Farbe* wird die *Fellfarbe*. Das letzte Wort bestimmt den Artikel: *die Farbe → die Fellfarbe*. **Fachwörter** benennen etwas genau. Kläre ihre Bedeutung."],["Die Wörterhilfe","Auf der Wörterhilfe findest du genaue Wörter für Körperteile. Wähle nur Wörter, die zu deinem Tier passen. Prüfe am Bild oder im Interview."],["Frage","Was ist genauer: „schönes Fell“ oder „oben dunkelbraunes Fell“?"],["Gesicherte Antwort","„oben dunkelbraunes Fell“. Die Farbe ist überprüfbar."]]},{"titel":"Aus Interview-Sprache wird Sachsprache","bild":null,"bloecke":[["Im Interview","Frau Berger spricht mit uns. Sie sagt *ich* und *unser Otto*, sie vergleicht und sagt ihre Meinung. Im Sachtext schreibst du über **alle Fischotter**, im **Präsens** und **ohne Meinung**."],["Beispiel","Interview: *„Sein Körper ist lang und schmal, fast wie ein Torpedo.“*\nSachtext: *Der Fischotter hat einen langen, schmalen Körper.*"],["Frage","Mache sachlich: *„Und der Kopf ist breit und flach. Ich sage immer: wie ein Brett mit Nase.“*"],["Gesicherte Antwort","*Der Kopf des Fischotters ist breit und flach.* Den Vergleich und „Ich sage immer“ lässt du weg."]]},{"titel":"Fische genau beschreiben","bild":"aquarium","bloecke":[["Ungenau","*„Der Fisch ist hübsch.“* Welcher Fisch ist gemeint? Das weiß niemand."],["Genau","*„Der Fisch hat einen kleinen Körper und eine sehr große Schwanzflosse.“* Das ist Fisch D."],["Rätsel mit einem Partner","Beschreibe einen Fisch mit zwei genauen Merkmalen. Verrate nicht, welchen du meinst. Dein Partner zeigt auf den passenden Fisch."],["Frage","Verbessere: „Der Fisch sieht cool aus.“ Nenne ein genaues Merkmal, damit man den Fisch erkennt."],["Gesicherte Antwort","Zum Beispiel: *„Der Fisch hat lange Flossen oben und unten.“* Das ist Fisch C. Andere genaue Merkmale sind auch richtig."]]},{"titel":"Im Präsens beschreiben","bild":null,"bloecke":[["Warum Präsens?","Tierbeschreibungen sagen, was allgemein für ein Tier gilt. Deshalb stehen sie meistens im **Präsens**, der Gegenwart: *Der Fischotter lebt an Gewässern.*"],["Grundform und gebeugte Form","Im Wörterbuch steht die **Grundform**: *leben, fressen, sein*.\nIm Satz beugst du das Verb passend:\n*leben → er lebt*\n*fressen → er frisst*\n*sein → sein Fell ist dicht.*"],["Subjekt und Verb","Das **Subjekt** ist der Satzgegenstand. Frage: Wer oder was schwimmt?\n*Der Otter schwimmt. Die Otter schwimmen.*"],["Frage","Was ändert sich?"],["Gesicherte Antwort","Bei mehreren Ottern heißt das Verb „schwimmen“ statt „schwimmt“."]]},{"titel":"Vollständige Sätze","bild":null,"bloecke":[["Ein vollständiger Satz","Verbinde die Angaben zu einem verständlichen Satz. Achte darauf, dass Subjekt und Verb zusammenpassen: *Der Fischotter lebt. Die Fischotter leben.*"],["Beispiel","Wortgruppe: *sein Fell – oben dunkelbraun – sein*\nSatz: *Sein Fell ist oben dunkelbraun.*\nDer Satz ist vollständig und verständlich."],["Frage","Was fehlt bei „Der Fischotter an einem See“?"],["Gesicherte Antwort","Das Verb. Vollständig heißt es: *Der Fischotter lebt an einem See.*"]]},{"titel":"Sätze prüfen","bild":null,"bloecke":[["Prüfe jeden Satz","Passt die Aussage zum Interview? Gilt sie für alle Tiere?\nIst der Satz vollständig?\nSteht das Verb im Präsens und passt es?\nSind die Wörter genau?\nBeginnen Satz und Nomen groß?\nSteht am Ende ein Punkt?"],["Beispiel verbessern","*„sein fell war schön“* wird zu: *„Sein Fell ist oben dunkelbraun.“* Die Angabe stammt aus dem Interview."]]}],"abschluss":"Bearbeite die Pflichtaufgaben auf Blatt 5 und 6 mit dem Fischotter-Interview. Vertiefungen sind freiwillig. Im Gelingensnachweis bildest du drei Sätze und machst aus einer Meinung einen sachlichen Satz. Bei vier von fünf Zielen gehst du weiter zu Etappe 3."},{"etappe":3,"titel":"Eine Tierbeschreibung schreiben und prüfen","ziel":"Ich kann aus einem Interview eine sachliche, geordnete und verständliche Tierbeschreibung schreiben.","abschnitte":[{"titel":"Vom Interview zum Plan","bild":null,"bloecke":[["Dein Ziel","Ich kann aus einem Interview eine sachliche, geordnete und verständliche Tierbeschreibung schreiben."],["Markieren und streichen","Markiere im Interview Sachangaben über **die Tierart**. Streiche Meinungen, Erlebnisse und Angaben nur über **das Zootier**. Aus einem Vergleich nimmst du nur die Sachangabe."],["Ein Plan in Stichwörtern","**Überblick:** Fischotter; Marder; ohne Schwanz etwa 60–90 cm\n**Aussehen:** langer, schmaler Körper; kurze Beine; oben dunkelbraunes Fell; breiter, flacher Kopf\n**Lebensraum:** Flüsse und Seen; Ufer mit Verstecken\n**Nahrung:** vor allem Fische, auch Frösche und Krebse"],["Frage","Gehört „Otto ist 80 Zentimeter lang“ in den Plan?"],["Gesicherte Antwort","Nein. Das gilt nur für Otto. In den Plan gehört das Maß der Art: ohne Schwanz etwa 60–90 cm."]]},{"titel":"Aus Stichwörtern wird Text","bild":null,"bloecke":[["Vom Plan zum Satz","Stichwörter: *Kopf – breit, flach*\nSatz: *Sein Kopf ist breit und flach.*\nNutze vollständige Sätze im Präsens. Schreibe sachlich und verbinde zusammengehörige Angaben."],["Ein vollständiges Beispiel","**Der Fischotter**\n*Der Fischotter gehört zu den Mardern. Er hat einen langen, schmalen Körper. Ohne Schwanz ist er etwa 60 bis 90 Zentimeter lang. Seine Beine sind kurz. Sein Fell ist oben dunkelbraun. Der Kopf ist breit und flach.*\n*Er lebt an Flüssen und Seen. Dort braucht er Ufer mit Verstecken. Er frisst vor allem Fische, aber auch Frösche und Krebse.*"]]},{"titel":"Mit Kriterien prüfen","bild":null,"bloecke":[["K1 · Informationen","Tiername, Maß der Art mit Einheit und Bezug, Lebensraum und Nahrung sind richtig im Text. Angaben nur über das Zootier gehören nicht hinein."],["K2 · Aussehen","Mindestens vier verschiedene äußere Merkmale sind genau beschrieben. Wiederholungen desselben Merkmals zählen nicht doppelt."],["K3 · Aufbau","Beginne mit Tiername und Überblick, etwa Körperform oder Maß. Ordne zusammengehörige Informationen. Absätze helfen."],["K4 und K5 · Sprache","Schreibe sachlich und im Präsens, ohne Meinungen aus dem Interview. Nutze genaue Wörter. Verbinde vollständige, verständliche Sätze zu einem Text."]]},{"titel":"Prüfen und überarbeiten","bild":null,"bloecke":[["K6 · Schreibung","Prüfe Satzanfänge, Nomen und Satzschlüsse. Vergleiche schwierige Tierwörter mit dem Interview.\n**Zeige deine Prüfung:** Kreise einen Satzanfang ein, unterstreiche zwei Nomen und markiere einen Satzschlusspunkt."],["Ein Beispiel prüfen","*„sein kopf ist breit und flach“* wird zu: *„Sein Kopf ist breit und flach.“*\nGroß: *Sein, Kopf*. Am Ende steht ein Punkt."],["Frage","Muss ein richtiger Satz verändert werden?"],["Gesicherte Antwort","Nein. Zeige die Prüfung und begründe: „Mein Satz bleibt, weil …“"]]}],"abschluss":"Bearbeite die Pflichtaufgaben auf Blatt 7–9 mit einem Interview. Vertiefungen sind freiwillig. Dein Abschluss ist die Probearbeit, dein letzter Gelingensnachweis. Vier von fünf Zielen = 80 %. Danach bekommst du Feedback für deinen nächsten Schritt."}],"strategien":[{"nr":1,"titel":"Lesen mit Suchauftrag","symbol":"lesen","wann":"Du suchst Informationen in einem Sachtext oder Interview.","schritte":["Lies den Text einmal. Markiere unbekannte Wörter.","Kläre die Wörter: Satz noch einmal lesen, Wörterhilfe, fragen.","Lies mit Suchauftrag weiter. Markiere die Stelle.","Notiere ein Stichwort unter der Überschrift."],"beispiel":"Was fressen Fischotter?\nSuchwort: *fressen*\n→ *hauptsächlich Fische*"},{"nr":2,"titel":"Markieren mit Buchstaben","symbol":"markieren","wann":"Du suchst verschiedene Informationen im selben Text.","schritte":["Lege fest, was du suchst.","Schreibe einen Buchstaben an die Stelle:\n**A** Aussehen · **L** Lebensraum\n**N** Nahrung · **M** Maß","Markiere nur die wichtigen Wörter, nicht den ganzen Satz.","Prüfe: Passt die Stelle zur Frage?"],"beispiel":"*Er lebt an Flüssen und Seen.* → **L**"},{"nr":3,"titel":"Ordnen unter Überschriften","symbol":"ordnen","wann":"Du sammelst Informationen für einen Plan.","schritte":["Schreibe die Überschriften: Überblick · Aussehen · Lebensraum · Nahrung.","Frage bei jeder Angabe: Wohin gehört sie?","Schreibe sie als Stichwort darunter.","Zähle: Hast du vier Merkmale beim Aussehen?"],"beispiel":"*breiter, flacher Kopf* → Aussehen\n*Fische* → Nahrung"},{"nr":4,"titel":"Genau statt wertend","symbol":"lupe","wann":"Du beschreibst, wie ein Tier aussieht.","schritte":["Lies dein Wort: Sagt es, wie jemand das Tier findet?","Frage: Kann ich es im Bild sehen oder im Interview lesen?","Ersetze die Wertung durch Form, Farbe oder Größe.","Prüfe die neue Angabe am Interview."],"beispiel":"nicht: *schönes Fell*\nsondern: *oben dunkelbraunes Fell*"},{"nr":5,"titel":"Die Wörterhilfe nutzen","symbol":"liste","wann":"Dir fehlt ein genaues Wort.","schritte":["Suche den Körperteil in der Wörterhilfe.","Lies die möglichen Wörter.","Wähle nur ein Wort, das zu deinem Tier passt.","Prüfe es am Bild oder im Text."],"beispiel":"Schwanz: *lang, kurz, buschig, schmal*\nErdmännchen: *lang und schmal*"},{"nr":6,"titel":"Einen Satz bauen","symbol":"satz","wann":"Du machst aus Stichwörtern einen Satz.","schritte":["Wer oder was? Nenne das Subjekt.","Was tut es oder wie ist es? Setze das Verb im Präsens.","Ergänze die Angabe aus dem Plan.","Prüfe: Großer Anfang? Punkt am Ende?"],"beispiel":"*Kopf – breit, flach*\n→ *Sein Kopf ist breit und flach.*"},{"nr":7,"titel":"Satzanfang, Nomen, Punkt","symbol":"pruefen","wann":"Du prüfst die Schreibung deines Textes.","schritte":["Lies Satz für Satz. Lege ein Lineal unter die Zeile.","Kreise den Satzanfang ein. Ist er groß?","Unterstreiche die Nomen. Sind sie groß?","Markiere das Satzende. Steht ein Punkt?"],"beispiel":"*sein kopf ist flach*\n→ *Sein Kopf ist flach.*"},{"nr":8,"titel":"Rückmeldung geben","symbol":"sprechen","wann":"Du liest den Text eines anderen Kindes an der Haltestelle.","schritte":["Lies den ganzen Text ruhig.","Wähle zwei Fragen von der Rückmeldekarte.","Zeige die passende Textstelle.","Sage es freundlich und genau."],"beispiel":"*Diese Stelle ist genau: …*\n*Prüfe diese Angabe im Material: …*"},{"nr":9,"titel":"Aus dem Interview wird ein Sachtext","symbol":"sprechen","wann":"Du schreibst mit einem Interview als Material.","schritte":["Frage bei jeder Angabe: Gilt das für alle Tiere der Art?","Ja: markieren. Nur das Zootier oder eine Meinung: streichen.","Vergleich? Nimm nur die Sachangabe heraus.","Schreibe im Präsens über die Tierart: *Der Fischotter …*"],"beispiel":"*„Otto ist 80 cm lang.“* → streichen\n*„Fischotter sind 60 bis 90 cm lang.“* → markieren"},{"nr":10,"titel":"Meine eigene Strategie","symbol":"stern","wann":"Du hast eine eigene Idee, die dir hilft.","schritte":["","","",""],"leer":true,"beispiel":""}],"checkliste":[{"kennung":"Checkliste","titel":"Inhalt und Aufbau","teile":[{"titel":"K1 · Informationen","text":"Hast du das Tier benannt? Stimmen Maß, Einheit und Bezug – für alle Tiere der Art, nicht nur für das Zootier? Stehen Lebensraum und Nahrung im Text? Vergleiche alles mit dem Interview."},{"titel":"K2 · Aussehen","text":"Findest du vier verschiedene genaue äußere Merkmale? Zeige sie. „schön“ ist kein genaues Merkmal."},{"titel":"K3 · Aufbau","text":"Stehen Tiername und Überblick am Anfang? Sind zusammengehörige Informationen zusammen?"}]},{"kennung":"Checkliste","titel":"Sprache und Schreibung","teile":[{"titel":"K4 · Sachlich schreiben","text":"Stehen deine Verben im Präsens? Beschreibst du genau? Hast du keine Meinung und kein Erlebnis aus dem Interview übernommen?"},{"titel":"K5 · Verständliche Sätze","text":"Sind deine Sätze vollständig und verständlich? Ist klar, auf wen sich „er“, „es“ und „sein“ beziehen?"},{"titel":"K6 · Schreibung prüfen","text":"Prüfe große Satzanfänge und Nomen sowie Satzschlusspunkte. Vergleiche schwierige Wörter mit dem Interview. Kreise einen Satzanfang ein, unterstreiche zwei Nomen und markiere einen Punkt als Prüfbeleg."}]}],"woerter":{"datei":"Woerterhilfe_A4","kennung":"Wörterhilfe","titel":"Genaue Wörter für dein Tier","hinweis":"Wähle nur Wörter, die zu deinem Tier passen. Prüfe die Angabe am Bild oder im Text.","tabelle":{"kopf":["Körperteil","genaue Angaben"],"zeilen":[["der Kopf","breit, schmal, flach, rund"],["die Schnauze","lang, kurz, spitz, breit"],["die Ohren","klein, groß, rund, spitz"],["das Fell","dicht, glatt, dunkelbraun, graubraun, gestreift, gefleckt"],["der Körper","lang gestreckt, schlank, kräftig"],["der Schwanz","lang, kurz, buschig, schmal, geringelt"],["die Beine / die Pfoten","kurz, lang, kräftig"]]},"listen":[["Fachwörter","die Tasthaare: Haare zum Ertasten\ndie Schwimmhäute: Haut zwischen den Zehen\ndie Krallen: spitze Nägel an den Zehen\nder Rumpf: Körper ohne Kopf, Beine und Schwanz"],["Genaue Verben","er lebt · er frisst · er schwimmt · er klettert · er gräbt · er hat · er ist"]],"achtung":"Ein Foto zeigt nicht alles. Ob ein Fell weich ist, siehst du nicht. Schreibe nur, was du belegen kannst."}},"uebungen":[{"id":"e1-fisch","etappe":1,"typ":"auswahl","titel":"Finde den Fisch","kurz":"Welcher Fisch ist gemeint?","bild":"aquarium","intro":"Lies die Beschreibung. Tippe auf den passenden Fisch. Passt sie zu allen Fischen? Dann ist sie zu ungenau.","siehe":"Merkblatt 1 · Finde den Fisch","optionen":[["A","Fisch A"],["B","Fisch B"],["C","Fisch C"],["D","Fisch D"],["alle","passt zu allen"]],"items":[{"text":"*Der Fisch hat einen runden Körper mit dunklen Streifen.*","richtig":"A","erklaerung":"Nur Fisch A ist rund und gestreift."},{"text":"*Der Fisch ist schön und schwimmt im Wasser.*","richtig":"alle","erklaerung":"Alle Fische schwimmen. „schön“ ist eine Meinung. Diese Beschreibung hilft nicht."},{"text":"*Der Fisch hat oben und unten lange, spitze Flossen. Sein Körper hat kein Muster.*","richtig":"C","erklaerung":"Fisch C hat lange Flossen oben und unten und kein Muster."},{"text":"*Der Fisch hat ein spitzes Maul und einen schmalen Körper mit Punkten.*","richtig":"B","erklaerung":"Nur Fisch B ist lang, schmal und gepunktet."},{"text":"*Der kleine Fisch hat eine große, breite Schwanzflosse.*","richtig":"D","erklaerung":"Fisch D hat einen kleinen Körper und eine sehr große Schwanzflosse."},{"text":"*Der Fisch sieht cool aus.*","richtig":"alle","erklaerung":"„cool“ sagt nur, wie jemand den Fisch findet. Man erkennt keinen Fisch daran."},{"text":"*Der Fisch hat einen hohen, runden Körper und eine kleine Schwanzflosse.*","richtig":"A","erklaerung":"Fisch A ist hoch und rund. Seine Schwanzflosse ist klein."}]},{"id":"e1-foto","etappe":1,"typ":"auswahl","titel":"Was zeigt das Foto?","kurz":"Sehe ich es oder steht es nur im Text?","bild":"fischotter","intro":"Schau dir das Foto genau an. Kannst du die Angabe auf dem Foto sicher sehen? Oder erfährst du sie nur aus dem Interview?","siehe":"Merkblatt 1 · Das zeigt dir das Foto","optionen":[["foto","sehe ich auf dem Foto"],["text","nur im Interview"]],"items":[{"text":"lange Tasthaare an der Schnauze","richtig":"foto","erklaerung":"Die langen Tasthaare siehst du gut an der Schnauze."},{"text":"Schwimmhäute zwischen den Zehen","richtig":"text","erklaerung":"Die Pfoten sind im Gras verdeckt. Erfinde keine verdeckten Merkmale."},{"text":"kleine Ohren","richtig":"foto","erklaerung":"Die Ohren sind gut zu sehen. Sie sind klein."},{"text":"ohne Schwanz 60 bis 90 Zentimeter lang","richtig":"text","erklaerung":"Eine Länge kannst du auf einem Foto nicht messen. Das Maß steht im Interview."},{"text":"am Hals helleres Fell","richtig":"foto","erklaerung":"Am Hals ist das Fell deutlich heller."},{"text":"Fischotter fressen vor allem Fische.","richtig":"text","erklaerung":"Auf dem Foto frisst der Otter nicht. Die Nahrung erfährst du im Interview."},{"text":"Fischotter leben an Flüssen und Seen.","richtig":"text","erklaerung":"Auf dem Foto siehst du nur Gras. Den Lebensraum erfährst du im Interview."},{"text":"ein breiter, flacher Kopf","richtig":"foto","erklaerung":"Den breiten, flachen Kopf siehst du gut."}]},{"id":"e1-sortieren","etappe":1,"typ":"auswahl","titel":"Was gehört in die Beschreibung?","kurz":"Sachangabe, nur Otto oder Meinung?","intro":"Frau Berger erzählt viel. Gilt der Satz für alle Fischotter? Geht es nur um Otto? Oder sagt jemand, wie er das Tier findet?","siehe":"Merkblatt 1 · Was gehört in die Beschreibung?","optionen":[["S","Sachangabe"],["X","nur Otto"],["W","Meinung"]],"items":[{"text":"*Fischotter gehören zu den Mardern.*","richtig":"S","erklaerung":"Das gilt für alle Fischotter. Es passt in die Beschreibung."},{"text":"*Unser Otto wartet am Gitter und pfeift laut.*","richtig":"X","erklaerung":"Das erzählt Frau Berger nur über Otto im Zoo."},{"text":"*Ehrlich gesagt ist er der süßeste Otter der Welt!*","richtig":"W","erklaerung":"„der süßeste“ sagt, wie Frau Berger Otto findet."},{"text":"*Sie brauchen Ufer, an denen sie sich verstecken können.*","richtig":"S","erklaerung":"Das gilt für alle Fischotter. Es gehört zum Lebensraum."},{"text":"*Gestern hat Otto einen Krebs ganz allein geknackt.*","richtig":"X","erklaerung":"Das ist ein Erlebnis mit Otto. Es gilt nicht für alle Fischotter."},{"text":"*Deshalb ist er so ein toller Schwimmer.*","richtig":"W","erklaerung":"„toll“ ist eine Meinung. Kein Merkmal."},{"text":"*Das Fell ist sehr dicht.*","richtig":"S","erklaerung":"Das gilt für alle Fischotter. Es gehört zum Aussehen."},{"text":"*Letzte Woche haben wir Otto gemessen: 80 Zentimeter.*","richtig":"X","erklaerung":"Die 80 Zentimeter gelten nur für Otto. In die Beschreibung gehört das Maß aller Fischotter."}]},{"id":"e1-detektiv","etappe":1,"typ":"detektiv","titel":"Interview-Detektiv","kurz":"Stellen im Fischotter-Interview zuordnen","interview":"fischotter","zootier":"Otto","intro":"Tippe auf eine unterstrichene Stelle. Entscheide: Wozu gehört sie? Oder streichst du sie?","siehe":"Merkblatt 1 · Das erfährst du im Interview","kuerzel":["A","L","N","M","W","X","V"],"optionen":[["A","Aussehen"],["L","Lebensraum"],["N","Nahrung"],["M","Maß"],["weg","streichen"]]},{"id":"e1-wortarten","etappe":1,"typ":"auswahl","titel":"Sprachdetektiv","kurz":"Nomen, Artikel, Verb oder Adjektiv?","intro":"Lies den Satz. Welche Wortart ist das **fette** Wort?","siehe":"Merkblatt 1 · Sprachdetektiv","optionen":[["N","Nomen"],["Ar","Artikel"],["V","Verb"],["Ad","Adjektiv"]],"items":[{"text":"*Der **Otter** schwimmt.*","richtig":"N","erklaerung":"„Otter“ benennt ein Tier. Es ist ein Nomen. Du schreibst es groß."},{"text":"*Der Otter **schwimmt**.*","richtig":"V","erklaerung":"„schwimmt“ sagt, was geschieht. Es ist ein Verb."},{"text":"*Das Fell ist **dicht**.*","richtig":"Ad","erklaerung":"„dicht“ beschreibt das Fell genauer. Es ist ein Adjektiv."},{"text":"***Das** Fell ist dicht.*","richtig":"Ar","erklaerung":"„Das“ begleitet das Nomen „Fell“. Es ist ein Artikel."},{"text":"*An der **Schnauze** sitzen lange Tasthaare.*","richtig":"N","erklaerung":"„Schnauze“ benennt einen Körperteil. Es ist ein Nomen."},{"text":"*Der Fischotter hat **kurze** Beine.*","richtig":"Ad","erklaerung":"„kurze“ beschreibt die Beine. Es ist ein Adjektiv."},{"text":"*Der Fischotter **frisst** vor allem Fische.*","richtig":"V","erklaerung":"„frisst“ sagt, was der Fischotter tut. Es ist ein Verb."},{"text":"*Die Ohren sind klein. **Die** Ohren sind rund.*","richtig":"Ar","erklaerung":"„Die“ begleitet das Nomen „Ohren“. Es ist ein Artikel."}]},{"id":"e2-genau","etappe":2,"typ":"auswahl","titel":"Genau statt wertend","kurz":"Welche Angabe ist genauer?","intro":"Wähle die Angabe, die man am Bild oder im Interview prüfen kann.","siehe":"Merkblatt 2 · Genau statt wertend","items":[{"text":"Was ist genauer als „schönes Fell“?","optionen":["oben dunkelbraunes Fell","tolles Fell","Fell wie Samt"],"richtig":0,"erklaerung":"Die Farbe kannst du prüfen. „toll“ ist eine Meinung, „wie Samt“ ein Vergleich."},{"text":"Was ist genauer als „cooler Schwanz“ beim Roten Panda?","optionen":["lustiger Schwanz","langer, buschiger Schwanz mit Ringen","Schwanz wie bei einem Kuscheltier"],"richtig":1,"erklaerung":"Länge, Form und Muster sind genaue Merkmale."},{"text":"Was ist genauer als *„Das Tier bewegt sich im Wasser.“*?","optionen":["*Das Tier ist im Wasser.*","*Der Fischotter macht etwas im Wasser.*","*Der Fischotter schwimmt im Wasser.*"],"richtig":2,"erklaerung":"„Fischotter“ ist genauer als „Tier“, „schwimmt“ genauer als „bewegt sich“."},{"text":"Herr Yıldız sagt über die Erdmännchen: *„Das sieht aus wie eine Sonnenbrille. Total cool, oder?“* Welche Sachangabe passt?","optionen":["*Das Erdmännchen trägt eine Sonnenbrille.*","*Das Erdmännchen hat dunkle Flecken um die Augen.*","*Das Erdmännchen sieht cool aus.*"],"richtig":1,"erklaerung":"Die Flecken sind ein Merkmal. Der Vergleich und die Meinung fallen weg."},{"text":"Welches Wort ist eine Meinung?","optionen":["dunkelbraun","kurz","süß"],"richtig":2,"erklaerung":"„süß“ sagt, wie jemand das Tier findet. Farbe und Länge kann man prüfen."},{"text":"Welches Wort ist kein genaues Merkmal?","optionen":["buschig","hübsch","spitz"],"richtig":1,"erklaerung":"„hübsch“ ist eine Meinung. „buschig“ und „spitz“ beschreiben eine Form."}]},{"id":"e2-sachsatz","etappe":2,"typ":"auswahl","titel":"Aus Interview-Sprache wird Sachsprache","kurz":"Welcher Satz passt in die Beschreibung?","intro":"Im Interview spricht jemand mit dir. Im Sachtext schreibst du über alle Tiere der Art, im Präsens und ohne Meinung.","siehe":"Merkblatt 2 · Aus Interview-Sprache wird Sachsprache","items":[{"text":"Frau Berger über das Fell: *„Oben ist es dunkelbraun, am Hals ist es heller.“*","optionen":["*Ottos Fell war oben dunkelbraun.*","*Oben ist es dunkelbraun.*","*Das Fell des Fischotters ist oben dunkelbraun und am Hals heller.*"],"richtig":2,"erklaerung":"Der Satz nennt das Tier, steht im Präsens und gilt für alle Fischotter. Bei „Oben ist es …“ weiß man nicht, was gemeint ist."},{"text":"Frau Berger über die Tasthaare: *„Damit spürt er Fische, auch wenn das Wasser trüb ist.“*","optionen":["*Mit seinen Tasthaaren spürt der Fischotter Fische auch in trübem Wasser.*","*Damit spürt er Fische.*","*Otto spürte gestern Fische im trüben Wasser.*"],"richtig":0,"erklaerung":"Der Satz sagt, womit der Fischotter spürt. „Damit“ allein ist unklar. Das Erlebnis mit Otto gehört nicht hinein."},{"text":"Frau Nowak sagt: *„Mei sieht aus wie ein Kuscheltier. Ich finde, sie ist das hübscheste Tier hier.“*","optionen":["*Der Rote Panda ist das hübscheste Tier.*","*Der Rote Panda sieht aus wie ein Kuscheltier.*","Das lasse ich weg: Vergleich und Meinung."],"richtig":2,"erklaerung":"Hier steckt keine Sachangabe. Vergleich und Meinung lässt du weg."},{"text":"Herr Yıldız sagt: *„Unsere Chefin heißt Kiki. Sie ist die Mutigste von allen.“*","optionen":["*Das Erdmännchen ist mutig.*","Das lasse ich weg: nur Kiki und eine Meinung.","*Kiki ist die Chefin der Erdmännchen.*"],"richtig":1,"erklaerung":"Kiki ist das Zootier. „die Mutigste“ ist eine Meinung. Beides gehört nicht hinein."},{"text":"Frau Nowak sagt: *„Der Kopf ist rund, und die Ohren sind groß und spitz.“*","optionen":["*Der Rote Panda hat einen runden Kopf und große, spitze Ohren.*","*Mei hatte einen runden Kopf.*","*Der Kopf ist rund und süß.*"],"richtig":0,"erklaerung":"Der Satz gilt für alle Roten Pandas und steht im Präsens. „süß“ wäre eine Meinung."}]},{"id":"e2-verben","etappe":2,"typ":"auswahl","titel":"Verb-Werkstatt","kurz":"Präsens und passendes Verb","intro":"Welches Verb passt in die Lücke? Achte auf das Präsens und auf das Subjekt.","siehe":"Merkblatt 2 · Im Präsens beschreiben","items":[{"text":"*Der Fischotter ___ vor allem Fische.*","optionen":["fressen","frisst","fraß"],"richtig":1,"erklaerung":"Ein Fischotter: „er frisst“. „fraß“ ist Vergangenheit."},{"text":"*Fischotter ___ an Flüssen und Seen.*","optionen":["leben","lebt","lebten"],"richtig":0,"erklaerung":"Mehrere Fischotter: „sie leben“. Präsens."},{"text":"*Das Erdmännchen ___ lange Krallen.*","optionen":["haben","hatte","hat"],"richtig":2,"erklaerung":"Ein Erdmännchen: „es hat“."},{"text":"*Die Ohren des Roten Pandas ___ groß und spitz.*","optionen":["ist","sind","waren"],"richtig":1,"erklaerung":"Subjekt sind „die Ohren“, also mehrere: „sie sind“."},{"text":"Wie heißt die **Grundform** von „schwimmt“?","optionen":["schwimmen","schwamm","geschwommen"],"richtig":0,"erklaerung":"Im Wörterbuch steht die Grundform: schwimmen."},{"text":"Wie heißt die **Grundform** von „hat“?","optionen":["hatte","haben","habt"],"richtig":1,"erklaerung":"Die Grundform ist „haben“: ich habe, er hat."},{"text":"*Der Rote Panda ___ hauptsächlich Bambus.*","optionen":["frisst","fressen","fresst"],"richtig":0,"erklaerung":"Ein Roter Panda: „er frisst“."}]},{"id":"e2-satzbau","etappe":2,"typ":"satzbau","titel":"Sätze bauen","kurz":"Wortkarten zu einem Satz ordnen","intro":"Tippe die Karten in der richtigen Reihenfolge an. Beginne mit dem Subjekt: Wer oder was?","siehe":"Merkblatt 2 · Vollständige Sätze","items":[{"teile":["Der Fischotter","lebt","an Flüssen und Seen","."],"erklaerung":"Subjekt, Verb, Angabe, Punkt."},{"teile":["Sein Kopf","ist","breit und flach","."],"erklaerung":"Wer oder was ist breit und flach? Sein Kopf."},{"teile":["Der Rote Panda","frisst","hauptsächlich Bambus","."],"erklaerung":"Das Verb steht an zweiter Stelle."},{"teile":["Das Erdmännchen","hat","eine spitze Schnauze","."],"erklaerung":"Großer Anfang, Verb im Präsens, Punkt am Ende."},{"teile":["An der Schnauze","hat","der Fischotter","lange Tasthaare","."],"erklaerung":"Auch so geht ein Satz: Das Verb bleibt an zweiter Stelle, das Subjekt kommt danach."}]},{"id":"e3-plan","etappe":3,"typ":"auswahl","titel":"Plan ordnen","kurz":"Wohin gehört das Stichwort?","intro":"Du baust einen Schreibplan zum Fischotter. Wohin gehört das Stichwort? Angaben nur über Otto und Vergleiche streichst du.","siehe":"Merkblatt 3 · Vom Interview zum Plan","optionen":[["U","Überblick"],["A","Aussehen"],["L","Lebensraum"],["N","Nahrung"],["weg","streichen"]],"items":[{"text":"gehört zu den Mardern","richtig":"U","erklaerung":"Die Tierfamilie gibt einen Überblick."},{"text":"lange Tasthaare an der Schnauze","richtig":"A","erklaerung":"Ein äußeres Merkmal gehört zum Aussehen."},{"text":"wie ein Brett mit Nase","richtig":"weg","erklaerung":"Das ist ein Vergleich. Die Sachangabe heißt: breiter, flacher Kopf."},{"text":"Flüsse und Seen","richtig":"L","erklaerung":"Hier lebt der Fischotter."},{"text":"ohne Schwanz etwa 60–90 cm","richtig":"U","erklaerung":"Das Maß der Art mit Einheit und Bezug gehört in den Überblick."},{"text":"Otto pfeift laut am Gitter","richtig":"weg","erklaerung":"Das gilt nur für Otto."},{"text":"vor allem Fische","richtig":"N","erklaerung":"Das frisst der Fischotter."},{"text":"Schwimmhäute zwischen den Zehen","richtig":"A","erklaerung":"Ein äußeres Merkmal gehört zum Aussehen."},{"text":"der süßeste Otter der Welt","richtig":"weg","erklaerung":"Das ist eine Meinung."},{"text":"kleine Ohren","richtig":"A","erklaerung":"Ein äußeres Merkmal gehört zum Aussehen."}]},{"id":"e3-merkmale","etappe":3,"typ":"saetze","titel":"Merkmale zählen","kurz":"Wie viele verschiedene Merkmale?","intro":"Tippe alle Sätze an, die ein **neues** äußeres Merkmal beschreiben. Ein Merkmal, das schon vorkam, zählt nicht noch einmal.","siehe":"Merkblatt 3 · Mit Kriterien prüfen (K2)","saetze":[{"text":"Der Fischotter gehört zu den Mardern.","ja":false,"erklaerung":"Das ist ein Überblick, kein äußeres Merkmal."},{"text":"Er hat einen langen, schmalen Körper.","ja":true,"erklaerung":"Merkmal 1: Körper."},{"text":"Die Beine sind kurz.","ja":true,"erklaerung":"Merkmal 2: Beine."},{"text":"Er lebt an Flüssen und Seen.","ja":false,"erklaerung":"Das ist der Lebensraum, kein Aussehen."},{"text":"Sein Fell ist oben dunkelbraun.","ja":true,"erklaerung":"Merkmal 3: Fell."},{"text":"Der Körper des Fischotters ist lang.","ja":false,"erklaerung":"Den Körper hast du schon. Er zählt nicht doppelt."},{"text":"Lange Tasthaare wachsen an seiner Schnauze.","ja":true,"erklaerung":"Merkmal 4: Tasthaare."},{"text":"Er frisst vor allem Fische.","ja":false,"erklaerung":"Das ist die Nahrung, kein Aussehen."}],"fazit":"Der Text hat vier verschiedene äußere Merkmale. Das reicht für K2."},{"id":"e3-fehlerjagd","etappe":3,"typ":"fehlerjagd","titel":"Fehlerjagd","kurz":"Satzanfang, Nomen, Punkt","intro":"Tippe jedes Wort an, das falsch geschrieben ist. Fehlt am Ende ein Punkt? Dann tippe auf **Ende**. Manche Sätze sind schon richtig.","siehe":"Merkblatt 3 · Prüfen und überarbeiten (K6)","items":[{"falsch":"der Fischotter hat kleine ohren","richtig":"Der Fischotter hat kleine Ohren."},{"falsch":"Das Erdmännchen hat einen schlanken körper.","richtig":"Das Erdmännchen hat einen schlanken Körper."},{"falsch":"Der Rote Panda frisst hauptsächlich Bambus.","richtig":"Der Rote Panda frisst hauptsächlich Bambus."},{"falsch":"sein fell ist oben dunkelbraun","richtig":"Sein Fell ist oben dunkelbraun."},{"falsch":"Fischotter leben an flüssen und Seen.","richtig":"Fischotter leben an Flüssen und Seen."},{"falsch":"Seine tasthaare sind lang","richtig":"Seine Tasthaare sind lang."}]},{"id":"t0-giraffe","etappe":"training","typ":"beispiel","titel":"Beispiel · Die Angola-Giraffe","kurz":"Eine Probearbeit Schritt für Schritt","quelle":"angola-giraffe","intro":"An einem neuen Tier siehst du, wie du eine Probearbeit oder Klassenarbeit löst. Bei jedem Schritt probierst du zuerst selbst. Dann deckst du die Lösung auf und vergleichst.","siehe":"Strategiekarte 9 · Aus dem Interview wird ein Sachtext","kuerzel":["T","A","L","N","M","W","X","V","U"],"optionen":[["T","Überblick"],["A","Aussehen"],["L","Lebensraum"],["N","Nahrung"],["M","Maß"],["weg","streichen"]]},{"id":"t1-detektiv","etappe":"training","typ":"detektiv","titel":"Ü1 · Die Elenantilope","kurz":"Interview markieren","interview":"elenantilope","zootier":"Kito","intro":"Tippe auf eine unterstrichene Stelle. Gehört sie in deinen Plan? Dann wähle die Überschrift. Sonst streichst du sie.","siehe":"Strategiekarte 9 · Aus dem Interview wird ein Sachtext","kuerzel":["T","A","L","N","M","W","X","V","U"],"optionen":[["T","Überblick"],["A","Aussehen"],["L","Lebensraum"],["N","Nahrung"],["M","Maß"],["weg","streichen"]]},{"id":"t2-detektiv","etappe":"training","typ":"detektiv","titel":"Ü2 · Die Hirschziegenantilope","kurz":"Interview markieren","interview":"hirschziegenantilope","zootier":"Raja","intro":"Tippe auf eine unterstrichene Stelle. Gehört sie in deinen Plan? Dann wähle die Überschrift. Sonst streichst du sie.","siehe":"Strategiekarte 9 · Aus dem Interview wird ein Sachtext","kuerzel":["T","A","L","N","M","W","X","V","U"],"optionen":[["T","Überblick"],["A","Aussehen"],["L","Lebensraum"],["N","Nahrung"],["M","Maß"],["weg","streichen"]]}],"detektiv_rueckmeldung":{"T":"Richtig: Das gibt einen Überblick über die Tierart.","A":"Richtig: Das ist ein äußeres Merkmal.","L":"Richtig: Hier lebt die Tierart.","N":"Richtig: Das frisst die Tierart.","M":"Richtig: Das ist das Maß der Art, mit Einheit und Bezug.","W":"Das ist eine Meinung. Du streichst sie.","X":"Das gilt nur für {zootier} oder den Zoo. Du streichst es.","V":"Das ist ein Vergleich. Du streichst ihn. Die Sachangabe steht meistens direkt davor.","U":"Das ist eine Vermutung. Du streichst sie."},"etappen_namen":{"1":"Etappe 1","2":"Etappe 2","3":"Etappe 3","training":"Training"},"interviews":{"elenantilope":{"titel":"„Kito springt über jeden Zaun“","einleitung":"Frau Demir ist Tierpflegerin. Sie kümmert sich um die Elenantilopen.","paare":[["Frau Demir, ist das da hinten eine Kuh?","Nein, das ist Kito, unser Bulle! [[Viele Besucher halten ihn für eine Kuh, weil er so groß ist.|X]] [[Elenantilopen gehören zu den größten Antilopen der Welt.|T]]"],["Wie groß ist so ein Tier?","[[Bei einem erwachsenen Männchen sind Kopf und Rumpf zusammen 2,50 bis 3,40 Meter lang. Der Schwanz kommt noch dazu.|M]] [[Kito wiegt im Moment 780 Kilogramm.|X]] [[Wir haben ihn letzten Monat auf eine Viehwaage gestellt. Das war ein Abenteuer!|X]]"],["Woran erkennt man eine Elenantilope?","[[Der Körper ist groß und massig.|A]] [[Das Fell ist hellbraun bis grau.|A]] [[An den Seiten hat sie schmale, helle Querstreifen.|A]] [[Am Hals hängt eine große Hautfalte. Sie heißt Wamme.|A]] [[Kitos Wamme wackelt beim Laufen hin und her, wie ein Vorhang.|V]]"],["Und die Hörner?","[[Beide, Männchen und Weibchen, haben Hörner.|A]] [[Die Hörner sind lang und schraubenförmig gedreht.|A]] [[Ich finde, Kito hat die schönsten Hörner im ganzen Zoo!|W]]"],["Wo leben Elenantilopen in der Natur?","[[In Afrika, vor allem im Osten und im Süden.|L]] [[Sie leben in Savannen und im Buschland.|L]] [[Bei uns ist es Kito im Winter manchmal zu nass, dann bleibt er lieber im Stall.|X]]"],["Was fressen sie?","[[Vor allem Blätter, Früchte und Schoten von Büschen und Bäumen.|N]] [[Gras fressen sie nur, wenn es frisch ist.|N]] [[Kito bekommt bei uns Heu, Zweige und jeden Tag ein paar Möhren.|X]] [[Die Möhren liebt er.|X]]"],["Stimmt es, dass Elenantilopen gut springen können?","[[Ja, junge Tiere springen aus dem Stand über Hindernisse, die so hoch sind wie zwei Menschen.|Z]] [[Ich glaube, Kito könnte über unseren Zaun springen. Er will aber nicht.|U]] [[Darüber bin ich ehrlich gesagt sehr froh!|W]]"],["Vielen Dank, Frau Demir!","[[Gern geschehen. Und besucht Kito bald einmal!|X]]"]],"woerter":[["Bulle","männliches Tier bei Rindern und großen Antilopen"],["massig","sehr groß und schwer"],["Wamme","Hautfalte am Hals"],["Schoten","Hüllen mit Samen, zum Beispiel bei Bohnen"]]},"fischotter":{"titel":"„Otto taucht am liebsten“","einleitung":"Frau Berger ist Tierpflegerin. Sie kümmert sich um die Fischotter.","paare":[["Frau Berger, wie fängt Ihr Tag bei den Ottern an?","[[Um halb acht mache ich die Anlage sauber. Danach gibt es Frühstück.|X]] [[Unser Otto wartet dann schon am Gitter und pfeift laut.|X]] [[Ehrlich gesagt ist er der süßeste Otter der Welt!|W]]"],["Was gibt es denn zum Frühstück?","Vor allem Fisch. [[Otto bekommt jeden Tag einen kleinen Eimer voll.|X]] In der Natur [[fressen Fischotter hauptsächlich Fische|N]]. [[Sie fangen aber auch Frösche und Krebse.|N]] [[Gestern hat Otto einen Krebs ganz allein geknackt. Das hat richtig gekracht!|X]]"],["Wo leben Fischotter, wenn sie nicht im Zoo sind?","[[An Flüssen und Seen.|L]] [[Sie brauchen Ufer, an denen sie sich verstecken können|L]], zum Beispiel unter Büschen und Wurzeln. [[Deshalb liegen in unserer Anlage auch so viele alte Wurzeln herum.|X]]"],["Ist ein Otter eigentlich mit dem Biber verwandt?","Nein. [[Fischotter gehören zu den Mardern.|T]] Biber sind Nagetiere. Das ist etwas ganz anderes."],["Woran erkennt man einen Fischotter?","Schauen Sie mal, wie er durchs Wasser saust! [[Sein Körper ist lang und schmal|A]], [[fast wie ein Torpedo|V]]. [[Die Beine sind dagegen richtig kurz.|A]] Und [[der Kopf ist breit und flach|A]]. Ich sage immer: [[wie ein Brett mit Nase|V]]."],["Und die Ohren? Ich sehe gar keine.","[[Die sind ganz klein.|A]] [[Beim Tauchen kann er sie sogar verschließen, damit kein Wasser hineinläuft.|Z]]"],["Wie groß ist Otto eigentlich?","[[Letzte Woche haben wir ihn gemessen. Von der Nase bis zum Schwanzansatz waren es 80 Zentimeter.|X]] Der Schwanz kommt noch dazu. [[Fischotter sind meistens 60 bis 90 Zentimeter lang, wenn man den Schwanz nicht mitzählt.|M]]"],["Darf man ihn streicheln? Das Fell sieht so weich aus.","Nein, [[Otto ist kein Kuscheltier. Ich fasse ihn nur an, wenn die Tierärztin kommt.|X]] [[Das Fell ist sehr dicht.|A]] [[Oben ist es dunkelbraun, am Hals ist es heller.|A]]"],["Gibt es noch etwas Besonderes?","Ja, [[die langen Tasthaare an der Schnauze|A]]! [[Damit spürt er Fische, auch wenn das Wasser trüb ist.|Z]] Und [[zwischen den Zehen hat er Schwimmhäute|A]]. [[Deshalb ist er so ein toller Schwimmer.|W]]"],["Vielen Dank, Frau Berger!","Gern. [[Und kommt Otto bald besuchen!|X]]"]],"woerter":[["Anlage","Gehege im Zoo"],["Tasthaare","Haare zum Ertasten"],["trüb","nicht klar, man sieht wenig"],["Schwanzansatz","Stelle, an der der Schwanz beginnt"]]},"hirschziegenantilope":{"titel":"„Raja ist der Schnellste“","einleitung":"Herr Lindner ist Tierpfleger. Er kümmert sich um die Hirschziegenantilopen.","paare":[["Herr Lindner, warum sind die Tiere so unterschiedlich gefärbt?","[[Das schwarze Tier ist Raja, unser Männchen.|X]] [[Bei Hirschziegenantilopen sehen Männchen und Weibchen ganz verschieden aus.|Z]] [[Erwachsene Männchen sind auf dem Rücken fast schwarz.|A]] [[Die Weibchen sind auf dem Rücken hellbraun.|A]] [[Der Bauch ist bei beiden weiß.|A]]"],["Was ist das Weiße um die Augen?","[[Um die Augen haben sie einen weißen Ring.|A]] [[Das sieht aus, als hätte Raja eine Brille auf.|V]] [[Total witzig, finde ich!|W]]"],["Haben alle Tiere Hörner?","[[Nein, nur die Männchen.|A]] [[Die Hörner sind lang und schraubenförmig gewunden.|A]] [[Sie sind meistens etwa 50 Zentimeter lang.|A]] [[Rajas Hörner sind sogar ein bisschen länger. Darauf ist er bestimmt stolz.|U]]"],["Wie groß ist so eine Antilope?","[[Kopf und Rumpf sind zusammen etwa 1,20 Meter lang. Der Schwanz kommt noch dazu.|M]] [[Sie wiegt ungefähr 40 Kilogramm.|M]] [[Raja wiegt 38 Kilo. Er ist sehr schlank.|X]]"],["Woher kommen Hirschziegenantilopen?","[[Aus Indien und Nepal.|L]] [[Dort leben sie in offenen Steppen und im Grasland.|L]] [[Ich war vor zwei Jahren in Indien und habe dort eine Herde gesehen. Das war mein schönster Urlaub!|X]]"],["Was fressen sie?","[[Hauptsächlich Gras.|N]] [[Manchmal fressen sie auch Blätter und Kräuter.|N]] [[Bei uns gibt es Heu und frisches Gras. Raja frisst immer zuerst die Kräuter heraus.|X]]"],["Leben die Tiere allein?","[[Nein, Hirschziegenantilopen leben in Herden.|Z]] [[Bei uns wohnen Raja und vier Weibchen zusammen. Die Weibchen heißen nach Blumen.|X]]"],["Und warum heißt das Interview „Raja ist der Schnellste“?","[[Hirschziegenantilopen können sehr schnell rennen, bis zu 80 Kilometer pro Stunde.|Z]] [[Raja rennt jeden Morgen einmal quer durch die Anlage.|X]] [[Für mich ist er das schnellste Tier im ganzen Zoo!|W]]"]],"woerter":[["Steppe","weites, trockenes Grasland ohne Wald"],["gewunden","in Drehungen gebogen"],["Rumpf","Körper ohne Kopf, Beine und Schwanz"],["Anlage","Gehege im Zoo"]]},"angola-giraffe":{"titel":"„Zikomo hat eine lange Zunge“","einleitung":"Frau Brandt ist Tierpflegerin im Zoo Dortmund. Sie kümmert sich um die Giraffen.","paare":[["Frau Brandt, wer ist der Riese da hinten?","[[Das ist Zikomo, unsere Angola-Giraffe.|X]] [[Er ist 2013 hier im Zoo Dortmund geboren.|X]] [[Ehrlich gesagt ist er der netteste Giraffenbulle der Welt!|W]]"],["Was ist eine Angola-Giraffe genau?","[[Die Angola-Giraffe ist eine Giraffe aus dem südlichen Afrika.|T]] [[In der Natur lebt sie in Savannen und offenen Wäldern, zum Beispiel in Namibia und Botswana.|L]]"],["Wie groß wird so eine Giraffe?","[[Erwachsene Männchen werden bis zu 6 Meter groß, vom Boden bis zum Kopf gemessen.|M]] [[Weibchen sind kleiner, etwa 4,5 Meter.|M]] [[Ein Bulle kann bis zu 2000 Kilogramm wiegen.|M]]"],["Woran erkennt man eine Angola-Giraffe?","Am Fell! [[Es ist hell und sandfarben.|A]] [[Darauf sitzen große braune Flecken mit gezackten Rändern.|A]] [[Das sieht aus wie ein riesiges Puzzle.|V]] [[Die Flecken reichen bis weit hinunter an die Beine.|A]]"],["Und der Hals?","[[Der Hals ist sehr lang.|A]] [[Trotzdem hat er nur sieben Halswirbel, genau wie bei uns Menschen.|Z]] [[Auch die Beine sind lang.|A]] [[Ich finde, Zikomo hat den elegantesten Hals im ganzen Zoo.|W]]"],["Was sind das für Knubbel auf dem Kopf?","[[Das sind zwei kurze Hörner.|A]] [[Sie sind mit Haut und Haaren bedeckt.|A]] [[Bullen setzen sie bei Kämpfen ein.|Z]] [[Zikomo lässt sich manchmal zwischen den Hörnern streicheln.|X]]"],["Und was hängt da am Schwanz?","[[Am Ende des Schwanzes sitzt eine Quaste aus langen schwarzen Haaren.|A]] [[Damit verscheuchen Giraffen Fliegen.|Z]]"],["Was frisst eine Giraffe?","[[Giraffen fressen nur Pflanzen.|N]] [[Vor allem zupfen sie Blätter von Bäumen und Sträuchern, auch von dornigen Akazien.|N]] [[Dafür haben sie eine lange Zunge.|A]] [[Sie kann bis zu 50 Zentimeter lang werden und ist dunkelblau bis schwarz.|A]] [[Zikomo frisst am liebsten Weiden- und Haselzweige.|X]]"],["Haben Sie noch einen Tipp für uns?","[[Kommt zur Fütterung!|X]] [[Dann zeigt Zikomo seine lange Zunge.|X]] [[Das ist der schönste Moment des Tages!|W]]"]],"woerter":[["Savanne","Grasland mit wenigen Bäumen"],["Bulle","ein männliches Tier, hier ein Giraffenmännchen"],["Halswirbel","Knochen im Hals"],["Akazie","ein Baum mit Dornen, der in Afrika wächst"],["Quaste","ein Büschel aus Haaren"]]}},"beispiele":{"angola-giraffe":{"id":"angola-giraffe","zootier":"Zikomo","hinweis":"Das Interview ist ausgedacht. Frau Brandt gibt es nicht. Die Angaben über die Angola-Giraffe und über Zikomo stimmen. Quellen: Stadt Dortmund, Newsroom zum Zoo Dortmund (2025, 2026).","schritte":[{"titel":"Den Auftrag verstehen","bloecke":[{"art":"text","titel":"Dein Auftrag","text":"Unser Tierlexikon bekommt eine neue Seite. Es fehlt noch ein Text über die Angola-Giraffe. Die Schülerzeitung „Zoo-Reporter“ hat dafür ein Interview im Zoo Dortmund geführt. Schreibe daraus einen Lexikontext. Andere sollen sich das Tier danach gut vorstellen können."},{"art":"liste","titel":"Das sollst du tun","nummeriert":true,"punkte":["Lies das Interview genau.","Markiere Sachangaben über die Tierart. Streiche Meinungen und Angaben nur über Zikomo.","Ordne deine Stichwörter im Schreibplan: Überblick · Aussehen · Lebensraum · Nahrung.","Schreibe einen Text mit Überschrift. Beschreibe mindestens vier äußere Merkmale.","Prüfe deinen Text mit „Das zählt“ (K1–K6)."]},{"art":"frage","text":"Im Interview geht es oft um Zikomo. Schreibst du über Zikomo oder über alle Angola-Giraffen?","antwort":"Du schreibst über **alle Angola-Giraffen**, also über die Tierart. Ein Lexikon erklärt, wie ein Tier allgemein ist. Was nur für Zikomo gilt, lässt du weg."},{"art":"frage","text":"Nenne die vier Teile, die in einen Lexikontext gehören.","antwort":"**Überblick** (Tiername und Maß mit Einheit), **Aussehen** (mindestens vier Merkmale), **Lebensraum** und **Nahrung**. Eine Mindestzahl an Wörtern gibt es nicht."}]},{"titel":"Das Interview lesen","bloecke":[{"art":"liste","titel":"So liest du","nummeriert":true,"punkte":["Lies das Interview einmal ganz. Merke dir Wörter, die du nicht verstehst.","Kläre sie mit der Wörterhilfe oder frage nach. Rate nicht.","Lies noch einmal mit Suchauftrag: Wie sieht die Giraffe aus? Wo lebt sie? Was frisst sie? Wie groß ist sie?"]},{"art":"interview"}]},{"titel":"Markieren und streichen","bloecke":[{"art":"liste","titel":"Drei Prüffragen für jeden Satz","nummeriert":false,"punkte":["Gilt es für **alle Angola-Giraffen**? Dann ist es eine **Sachangabe**. Du markierst sie.","Geht es nur um **Zikomo** oder den Zoo? Dann ist es ein **Einzelfall**. Du streichst ihn.","Sagt jemand, wie er das Tier **findet**? Dann ist es eine **Meinung**. Du streichst sie.","Bei einem **Vergleich** („wie ein Puzzle“) nimmst du nur die Sachangabe heraus."]},{"art":"detektiv"}]},{"titel":"Den Schreibplan machen","bloecke":[{"art":"text","titel":"Ordne deine Stichwörter","text":"Schreibe vier Überschriften: Überblick · Aussehen · Lebensraum · Nahrung. Ordne die markierten Stellen zu. Nimm nur Stichwörter, keine ganzen Sätze. Mache deinen Plan zuerst selbst im Heft. Decke dann Teil für Teil auf."},{"art":"plan","teile":[["Überblick",["Angola-Giraffe: Giraffe aus dem südlichen Afrika","Männchen bis zu 6 m groß, vom Boden bis zum Kopf","Weibchen etwa 4,5 m"]],["Aussehen",["Fell hell, sandfarben","große braune Flecken, Ränder gezackt","Flecken bis weit an die Beine","Hals sehr lang","Beine lang","zwei kurze Hörner mit Haut und Haaren","Quaste aus schwarzen Haaren am Schwanz","Zunge bis 50 cm, dunkelblau bis schwarz"]],["Lebensraum",["Savannen und offene Wälder","zum Beispiel Namibia, Botswana"]],["Nahrung",["nur Pflanzen","vor allem Blätter von Bäumen und Sträuchern, auch Akazien"]],["Gestrichen",["Zikomo, 2013 geboren","„der netteste Giraffenbulle“","„wie ein riesiges Puzzle“","„den elegantesten Hals“","Zikomo lässt sich streicheln","Zikomos Lieblingszweige, die Fütterung"]]]},{"art":"frage","text":"Im Interview stehen drei Zahlen: 6 Meter, 4,5 Meter und 2000 Kilogramm. Was musst du beim Maß beachten?","antwort":"Ein Maß braucht eine **Einheit** und einen **Bezug**: Für wen gilt es, und was wird gemessen? Richtig ist zum Beispiel: *Erwachsene Männchen werden vom Boden bis zum Kopf bis zu 6 Meter groß.* Falsch wäre: *Die Giraffe ist 6 Meter.* Dann fehlt der Bezug."}]},{"titel":"Aus Stichwörtern werden Sätze","bloecke":[{"art":"liste","titel":"So baust du einen Satz","nummeriert":true,"punkte":["Wer oder was? Nenne das Subjekt: *Die Angola-Giraffe*, *Ihr Fell*.","Setze das Verb im Präsens: *hat, ist, lebt, frisst*.","Ergänze die Angabe aus dem Plan.","Prüfe: Großer Anfang? Punkt am Ende?"]},{"art":"paare","titel":"Probiere es selbst","text":"Sprich oder schreibe zuerst deinen Satz. Tippe dann auf „Beispiel zeigen“.","paare":[["Fell – hell, sandfarben","Ihr Fell ist hell und sandfarben."],["Flecken – groß, braun, Ränder gezackt","Darauf sitzen große braune Flecken mit gezackten Rändern."],["Männchen – bis 6 m – vom Boden bis zum Kopf","Erwachsene Männchen werden vom Boden bis zum Kopf bis zu 6 Meter groß."],["Interview: „Ich finde, Zikomo hat den elegantesten Hals im ganzen Zoo.“","Die Angola-Giraffe hat einen sehr langen Hals. (Die Meinung fällt weg. Die Sachangabe steht im Interview direkt davor.)"],["Interview: „Das sieht aus wie ein riesiges Puzzle.“","Du lässt den Vergleich weg. Die Sachangabe steht schon davor: große braune Flecken mit gezackten Rändern."],["Giraffen – fressen – Blätter (über eine Giraffe schreiben)","Die Angola-Giraffe frisst vor allem Blätter. (Eine Giraffe: frisst. Mehrere Giraffen: fressen.)"]]}]},{"titel":"Drei Mustertexte vergleichen","bloecke":[{"art":"text","text":"Alle drei Texte sind richtig. Sie zeigen drei Stufen: Mindeststandard, Regelstandard und Leistungsstandard."},{"art":"muster","texte":{"min":{"name":"Mindeststandard","sub":"kurz und richtig","titel":"Die Angola-Giraffe","absaetze":[[["Die Angola-Giraffe ist eine Giraffe aus Afrika.","T"]," ",["Männchen werden bis zu 6 Meter groß.","M"]," Sie hat ",["einen langen Hals","A"],". Sie hat ",["lange Beine","A"],". ",["Das Fell ist hell.","A"]," Es hat ",["braune Flecken","A"],". Sie hat ",["zwei kurze Hörner","A"],". Die Angola-Giraffe ",["lebt in Savannen","L"],". Sie ",["frisst Blätter","N"],"."]],"kriterien":[["K1","Tiername, Maß mit Einheit (Männchen, 6 Meter), Lebensraum und Nahrung sind da. Nichts über Zikomo."],["K2","Fünf Merkmale: Hals, Beine, helles Fell, braune Flecken, Hörner. Sie sind richtig, aber noch wenig genau."],["K3","Erst der Überblick, dann Aussehen, Lebensraum, Nahrung. Noch keine Absätze."],["K4","Sachlich und im Präsens. Einfache Wörter."],["K5","Kurze, vollständige Sätze. Viele beginnen gleich mit „Sie hat“."],["K6","Satzanfänge und Nomen groß, Punkte gesetzt."]],"weiter":"Beschreibe die Merkmale genauer (Farbe, Form, Muster). Verbinde Sätze, die zusammengehören. Mache Absätze."},"reg":{"name":"Regelstandard","sub":"genau und geordnet","titel":"Die Angola-Giraffe","absaetze":[[["Die Angola-Giraffe ist eine Giraffe aus dem südlichen Afrika.","T"]," ",["Erwachsene Männchen werden vom Boden bis zum Kopf bis zu 6 Meter groß.","M"]," ",["Weibchen sind kleiner.","M"]],["Die Giraffe hat ",["einen sehr langen Hals","A"]," und ",["lange Beine","A"],". ",["Ihr Fell ist hell und sandfarben.","A"]," Darauf sitzen ",["große braune Flecken mit gezackten Rändern","A"],". Auf dem Kopf trägt sie ",["zwei kurze Hörner, die mit Haut und Haaren bedeckt sind","A"],"."],["Die Angola-Giraffe ",["lebt in Savannen und offenen Wäldern, zum Beispiel in Namibia und Botswana","L"],". ",["Sie frisst nur Pflanzen.","N"]," Vor allem ",["zupft sie Blätter von Bäumen und Sträuchern","N"],"."]],"kriterien":[["K1","Alle Angaben stimmen mit dem Interview. Das Maß hat Einheit und Bezug: Männchen, vom Boden bis zum Kopf."],["K2","Fünf Merkmale, jeweils genau: Körperteil plus Farbe, Form oder Muster („gezackte Ränder“)."],["K3","Drei Absätze: Überblick, Aussehen, Lebensraum und Nahrung."],["K4","Genaue Wörter wie „sandfarben“, „zupft“. Kein Vergleich, keine Meinung."],["K5","Sätze sind verbunden („und“, „Darauf“, „Auf dem Kopf“). Die Satzanfänge wechseln."],["K6","Sicher bei Satzanfängen, Nomen und Punkten."]],"weiter":"Wähle Merkmale, an denen man gerade diese Giraffe gut erkennt. Verknüpfe die Angaben noch flüssiger."},"leis":{"name":"Leistungsstandard","sub":"präzise und flüssig","titel":"Die Angola-Giraffe","absaetze":[[["Die Angola-Giraffe ist eine Giraffe aus dem südlichen Afrika.","T"]," ",["Erwachsene Männchen werden vom Boden bis zum Kopf bis zu 6 Meter groß und können bis zu 2000 Kilogramm wiegen.","M"]," ",["Weibchen erreichen etwa 4,5 Meter.","M"]],["Am auffälligsten sind ",["der sehr lange Hals","A"]," und ",["die langen Beine","A"],". ",["Das helle, sandfarbene Fell","A"]," ist mit ",["großen braunen Flecken bedeckt, deren Ränder gezackt sind","A"],". ",["Diese Flecken reichen bis weit hinunter an die Beine.","A"]," Auf dem Kopf sitzen ",["zwei kurze Hörner, die mit Haut und Haaren überzogen sind","A"],". Am Ende des Schwanzes hängt ",["eine Quaste aus langen schwarzen Haaren","A"],"."],["In der Natur ",["lebt die Angola-Giraffe in Savannen und offenen Wäldern, etwa in Namibia und Botswana","L"],". ",["Sie ernährt sich ausschließlich von Pflanzen.","N"]," Mit ",["ihrer bis zu 50 Zentimeter langen, dunkelblauen Zunge","A"]," ",["zupft sie Blätter von Bäumen und Sträuchern, sogar von dornigen Akazien","N"],"."]],"kriterien":[["K1","Alle Angaben sind sicher und stammen aus dem Interview. Zwei Maße, beide mit Einheit und Bezug."],["K2","Viele kennzeichnende Merkmale. Die Flecken bis an die Beine, die Schwanzquaste und die dunkelblaue Zunge machen das Tier gut erkennbar."],["K3","Klarer Weg: Überblick, dann Aussehen vom Auffälligsten zu den Einzelheiten, dann Lebensraum und Nahrung."],["K4","Durchgehend genau und abwechslungsreich: „überzogen“, „ernährt sich ausschließlich“."],["K5","Flüssig verknüpft: „Am auffälligsten“, „Diese Flecken“, „Mit ihrer … Zunge“. Längere Sätze bleiben klar."],["K6","Weitgehend sicher, auch bei schwierigen Wörtern wie „Akazien“."]],"weiter":"Prüfe, ob jeder lange Satz noch gut lesbar ist. Ein klarer kurzer Satz ist besser als ein verschachtelter langer."}}}]},{"titel":"Prüfen und verbessern","bloecke":[{"art":"entwurf","titel":"Finde die Fehler","text":"Ein Kind hat diesen Anfang geschrieben. Finde mindestens vier Stellen, die nicht passen.","entwurf":"die Angola-Giraffe\nZikomo ist 2013 im Zoo Dortmund geboren. die giraffe hatte einen sehr langen hals Sie ist total elegant. Ihr Fell ist hell.","loesung":["**K1:** Der erste Satz gilt nur für Zikomo. Er gehört nicht hinein. Es fehlen Maß, Lebensraum und Nahrung.","**K4:** „hatte“ steht in der Vergangenheit. Richtig: „hat“.","**K4:** „total elegant“ ist eine Meinung. Streiche sie.","**K6:** „die“ am Satzanfang, „giraffe“ und „hals“ schreibt man groß. Nach „hals“ fehlt ein Punkt. Auch die Überschrift beginnt groß."],"verbessert":"*Die Angola-Giraffe hat einen sehr langen Hals. Ihr Fell ist hell und sandfarben.*"},{"art":"liste","titel":"So zeigst du die Prüfung (K6)","nummeriert":false,"punkte":["Kreise einen Satzanfang ein. Unterstreiche zwei Nomen. Markiere einen Punkt.","Ein richtiger Satz bleibt, wie er ist. Du begründest nur: „Mein Satz bleibt, weil …“"]}]},{"titel":"Deinen nächsten Schritt finden","bloecke":[{"art":"liste","titel":"Und du?","text":"Lege deinen eigenen Text neben die drei Mustertexte. Welchem ähnelt er am meisten? Wähle dann einen Schritt:","nummeriert":false,"punkte":["Fehlt noch etwas aus K1? Dann suche Maß, Lebensraum und Nahrung im Interview.","Hast du weniger als vier Merkmale? Dann übe mit Blatt 4 und Blatt 7.","Klingen alle Sätze gleich („Sie hat … Sie hat …“)? Dann verbinde zwei Sätze mit „und“ oder beginne anders.","Ist schon alles da? Dann suche ein Merkmal, an dem man die Angola-Giraffe besonders gut erkennt."]},{"art":"liste","titel":"Merke dir den Weg","nummeriert":true,"punkte":["Auftrag lesen: Über wen schreibe ich?","Interview lesen, Wörter klären.","Sachangaben markieren, Meinungen und Einzelfälle streichen.","Schreibplan mit vier Überschriften.","Aus jedem Stichwort einen Satz im Präsens.","Mit K1 bis K6 prüfen und den Prüfbeleg zeigen."]}]}]}},"raetsel":{"intro":"Bringe die Buchstaben in die richtige Reihenfolge. Der Hinweis hilft dir.","woerter":[["Tasthaare","Haare an der Schnauze zum Ertasten"],["Schwimmhäute","Haut zwischen den Zehen"],["Krallen","spitze Nägel an den Zehen"],["Rumpf","Körper ohne Kopf, Beine und Schwanz"],["Lebensraum","Wo lebt ein Tier in der Natur?"],["Nahrung","Was frisst ein Tier?"],["Merkmal","Daran erkennt man ein Tier."],["Sachangabe","Sie gilt für alle Tiere einer Art."],["Meinung","Sie sagt, wie jemand etwas findet."],["Präsens","die Zeitform für Tierbeschreibungen"],["Nomen","Wortart, die du großschreibst"],["Adjektiv","Wortart, die Merkmale beschreibt"],["Verb","Wortart, die sagt, was geschieht"],["Artikel","der, die oder das"],["Überblick","Er steht am Anfang der Tierbeschreibung."],["Marder","Zu dieser Tierfamilie gehört der Fischotter."],["Mangusten","Zu dieser Tierfamilie gehört das Erdmännchen."],["Bambus","Davon ernährt sich der Rote Panda hauptsächlich."],["Savanne","Grasland mit wenigen Bäumen"],["Dämmerung","Zeit zwischen Tageslicht und Dunkelheit"],["Grundform","So steht ein Verb im Wörterbuch."],["Subjekt","Wer oder was? Der Satzgegenstand"],["Wamme","Hautfalte am Hals der Elenantilope"],["Steppe","weites, trockenes Grasland ohne Wald"]]},"zuhause":{"intro":"Du kannst auch ohne Schulmaterial üben. Beschreibe ein Tier, das du wirklich sehen kannst: ein Haustier, eine Amsel, eine Taube, ein Eichhörnchen, eine Ente im Park oder eine Spinne am Fenster.","schritte":[{"titel":"Beobachten wie im Zoo","text":"Schau das Tier ruhig an. Was siehst du **sicher**? Körperform, Fellfarbe, Schwanz, Ohren, Beine. Was siehst du **nicht**? Notiere Stichwörter. Du kannst das Tier auch ins Heft zeichnen und beschriften."},{"titel":"Dein eigenes Interview","text":"Frage jemanden aus deiner Familie über ein Tier, zum Beispiel Oma über ihre Katze. Schreibe die Antworten auf. Sortiere danach: Was gilt für **alle Katzen**? Das ist eine Sachangabe. Was gilt nur für **eure Katze**? Das ist ein Einzelfall. Was ist eine **Meinung**? Genau so hast du es beim Fischotter gemacht."},{"titel":"Grenze der Beobachtung","text":"Lebensraum, Nahrung und das Maß der Art siehst du nicht an einem einzelnen Tier. Schlage in einem Tierlexikon nach, frage in der Bücherei oder frage einen Erwachsenen. Schreibe nur Angaben, die du belegen kannst."},{"titel":"Messen ist ein Einzelfall","text":"*„Unsere Katze ist 45 Zentimeter lang.“* Das gilt nur für eure Katze. Wie bei Otto. In die Beschreibung gehört das Maß der Tierart."},{"titel":"Zu zweit raten","text":"Beschreibe ein Tier mit zwei genauen Merkmalen. Sage den Namen nicht. Jemand aus deiner Familie rät. Waren deine Merkmale genau genug?"}],"ideen":["Hund oder Katze","Amsel","Taube","Eichhörnchen","Stockente","Meerschweinchen","Kaninchen","Spinne","Schnecke","Kuh oder Pferd"],"sicherheit":["Fasse fremde Tiere nicht an.","Füttere keine Tiere, die nicht dir gehören.","Störe Wildtiere nicht. Bleib auf Abstand.","Miss ein Haustier nur, wenn es das mag und ein Erwachsener erlaubt es.","Wasch dir nach dem Kontakt mit Tieren die Hände."],"plan":{"titel":"Mein Schreibplan","hinweis":"Stichwörter reichen. Deinen Text schreibst du ins Heft. Der Plan bleibt nur auf diesem Handy.","felder":[["tier","Welches Tier?"],["ueberblick","Überblick: Tierfamilie, Größe oder Gewicht"],["a1","Aussehen: Merkmal 1"],["a2","Aussehen: Merkmal 2"],["a3","Aussehen: Merkmal 3"],["a4","Aussehen: Merkmal 4"],["leben","Lebensraum"],["nahrung","Nahrung"],["quelle","Woher weißt du das? (beobachtet, Lexikon, gefragt …)"]]},"check_titel":"Prüfe deinen Text im Heft"},"nachweise":["Fischotter: Dave Pape · Public Domain (Wikimedia Commons).","Aquarium-Grafik: eigene Zeichnung für diese Reihe."]};
