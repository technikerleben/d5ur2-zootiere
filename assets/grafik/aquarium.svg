<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Andika, sans-serif">
  <title>Aquarium mit vier Fischen A bis D</title>
  <rect x="4" y="4" width="792" height="412" rx="24" fill="#f4f4f4" stroke="#222" stroke-width="5"/>
  <path d="M30 392 Q120 370 210 392 T390 392 T570 392 T770 392 L770 410 L30 410 Z" fill="#cfcfcf"/>
  <!-- Wasserpflanzen -->
    <path d="M740 392 C752 330 722 300 742 240" fill="none" stroke="#9a9a9a" stroke-width="8" stroke-linecap="round"/>

  <!-- A: runder, hoher Körper mit senkrechten Streifen, kleine Schwanzflosse -->
  <g transform="translate(200 120)">
    <path d="M60 0 L95 -28 L95 28 Z" fill="#8c8c8c" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="0" cy="0" rx="72" ry="62" fill="#d9d9d9" stroke="#222" stroke-width="4"/>
    <clipPath id="ka"><ellipse cx="0" cy="0" rx="72" ry="62"/></clipPath>
    <g clip-path="url(#ka)" fill="#3a3a3a">
      <rect x="-38" y="-70" width="14" height="140"/><rect x="-6" y="-70" width="14" height="140"/><rect x="26" y="-70" width="14" height="140"/>
    </g>
    <circle cx="-44" cy="-14" r="9" fill="#fff" stroke="#222" stroke-width="3"/><circle cx="-46" cy="-14" r="4" fill="#111"/>
    <circle cx="-150" cy="-70" r="32" fill="#fff" stroke="#222" stroke-width="4"/><text x="-150" y="-55" font-size="46" font-weight="700" text-anchor="middle" fill="#111">A</text>
  </g>

  <!-- B: langer, schmaler Körper mit dunklen Punkten, spitzes Maul -->
  <g transform="translate(560 110)">
    <path d="M110 0 L150 -26 L142 0 L150 26 Z" fill="#8c8c8c" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-130 0 Q-40 -34 112 -12 L112 12 Q-40 34 -130 0 Z" fill="#d9d9d9" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
    <g fill="#2e2e2e"><circle cx="-40" cy="-6" r="6"/><circle cx="-10" cy="8" r="6"/><circle cx="20" cy="-8" r="6"/><circle cx="50" cy="6" r="6"/><circle cx="80" cy="-4" r="6"/><circle cx="-70" cy="6" r="5"/></g>
    <circle cx="-98" cy="-5" r="7" fill="#fff" stroke="#222" stroke-width="3"/><circle cx="-100" cy="-5" r="3.5" fill="#111"/>
    <circle cx="-150" cy="-66" r="32" fill="#fff" stroke="#222" stroke-width="4"/><text x="-150" y="-51" font-size="46" font-weight="700" text-anchor="middle" fill="#111">B</text>
  </g>

  <!-- C: flacher, dreieckiger Körper mit langen Flossen oben und unten, ohne Muster -->
  <g transform="translate(220 300)">
    <path d="M-10 -40 L30 -110 L40 -36 Z" fill="#bdbdbd" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-10 40 L30 110 L40 36 Z" fill="#bdbdbd" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
    <path d="M60 0 L95 -22 L95 22 Z" fill="#bdbdbd" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-62 0 L20 -48 L64 0 L20 48 Z" fill="#ffffff" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="-30" cy="-6" r="8" fill="#fff" stroke="#222" stroke-width="3"/><circle cx="-32" cy="-6" r="3.5" fill="#111"/>
    <circle cx="-150" cy="-40" r="32" fill="#fff" stroke="#222" stroke-width="4"/><text x="-150" y="-25" font-size="46" font-weight="700" text-anchor="middle" fill="#111">C</text>
  </g>

  <!-- D: kleiner Körper, sehr große fächerförmige Schwanzflosse -->
  <g transform="translate(560 300)">
    <path d="M30 0 L130 -70 Q150 0 130 70 Z" fill="#6e6e6e" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
    <path d="M40 0 L124 -52 M40 0 L136 -18 M40 0 L136 18 M40 0 L124 52" stroke="#bdbdbd" stroke-width="4" fill="none"/>
    <ellipse cx="-10" cy="0" rx="46" ry="26" fill="#d9d9d9" stroke="#222" stroke-width="4"/>
    <circle cx="-32" cy="-6" r="7" fill="#fff" stroke="#222" stroke-width="3"/><circle cx="-34" cy="-6" r="3.5" fill="#111"/>
    <circle cx="-150" cy="-40" r="32" fill="#fff" stroke="#222" stroke-width="4"/><text x="-150" y="-25" font-size="46" font-weight="700" text-anchor="middle" fill="#111">D</text>
  </g>
</svg>
