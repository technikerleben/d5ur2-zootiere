<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Etappe 3 · Schreiben</title><style>*{box-sizing:border-box}body{margin:0;background:#eff5fa;color:#18324a;font:22px/1.45 system-ui}header,main,footer{max-width:1180px;margin:auto;padding:20px}header{border-bottom:5px solid #48dccb}h1{font-size:24px}h2{font-size:clamp(30px,4vw,46px);line-height:1.15}article{background:white;border-top:7px solid #245688;border-radius:12px;padding:28px 36px;min-height:360px}article p{font-size:clamp(24px,2.6vw,34px)}button,select{font:inherit;padding:10px 14px;min-height:48px;background:#245688;color:white;border:2px solid #245688;border-radius:8px}select{background:white;color:#18324a;max-width:100%}nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center}a{color:#245688}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #cf6320;outline-offset:3px}img{display:block;margin:auto;max-width:100%;max-height:48vh}footer{font-size:18px}.section{font-size:20px}.controls{margin-top:20px;display:flex;gap:15px;align-items:center;flex-wrap:wrap}[hidden]{display:none!important}@media(max-width:650px){article{padding:20px}header,main{padding:14px}}</style></head><body><header><h1>Etappe 3 · Eine Tierbeschreibung schreiben und prüfen</h1><nav><a href="../../index.html#etappe3">Zum Cockpit</a><a href="Merkblatt_3_A5.pdf">Identisches Merkblatt</a><label for="slide">Abschnitt</label><select id="slide"><option value="0">1. Vom Material zum Plan · Dein Ziel</option><option value="1">2. Vom Material zum Plan · Ein Plan in Stichwörtern</option><option value="2">3. Vom Material zum Plan · Frage und Antwort</option><option value="3">4. Aus Stichwörtern wird Text · Vom Plan zum Satz</option><option value="4">5. Aus Stichwörtern wird Text · Ein vollständiges Beispiel</option><option value="5">6. Mit Kriterien prüfen · K1 | Informationen</option><option value="6">7. Mit Kriterien prüfen · K2 | Aussehen</option><option value="7">8. Mit Kriterien prüfen · K3 | Aufbau</option><option value="8">9. Mit Kriterien prüfen · K4 und K5 | Sprache</option><option value="9">10. Prüfen und überarbeiten · K6 | Schreibung</option><option value="10">11. Prüfen und überarbeiten · Ein Beispiel prüfen</option><option value="11">12. Prüfen und überarbeiten · Dein Abschluss</option></select></nav></header><main><article><p class="section" id="section"></p><h2 id="title"></h2><img id="photo" src="../gelingensnachweise/Fischotter_DavePape_Graustufen.jpg" alt="Fischotter mit kleinen Ohren und langen Tasthaaren an der Schnauze" hidden><p id="text"></p><p id="source" hidden><a href="https://commons.wikimedia.org/wiki/File:Lutra_lutra_1_-_Otter,_Owl,_and_Wildlife_Park.jpg">Bildquelle: Dave Pape · Public Domain</a></p></article><nav class="controls" aria-label="Folien"><button id="prev">Zurück</button><span id="count" aria-live="polite"></span><button id="next">Weiter</button></nav></main><footer>Lehrkraftansicht · Pfeiltasten zum Blättern · Fachlicher Inhalt wie Merkblatt 3.</footer><script>const slides=[{"section": "Vom Material zum Plan", "title": "Dein Ziel", "text": "Ich kann ein Tier mit Material sachlich, geordnet und verständlich beschreiben."}, {"section": "Vom Material zum Plan", "title": "Ein Plan in Stichwörtern", "text": "Überblick: Fischotter; Kopf und Rumpf etwa 60-90 cm, Schwanz zusätzlich.\u003cbr/>Aussehen: lang gestreckter Körper; kurze Beine; oben dunkelbraunes Fell; breiter, flacher Kopf.\u003cbr/>Lebensraum: Flüsse und Seen mit geschützten Ufern.\u003cbr/>Nahrung: vor allem Fische, auch Frösche und Krebse."}, {"section": "Vom Material zum Plan", "title": "Frage und Antwort", "text": "Was fehlt bei „60-90“? Antwort: Einheit und Bezug. Richtig: Kopf und Rumpf etwa 60-90 cm, ohne Schwanz. Prüfe alle Angaben am Material."}, {"section": "Aus Stichwörtern wird Text", "title": "Vom Plan zum Satz", "text": "Stichwörter: Kopf - breit, flach.\u003cbr/>Satz: Sein Kopf ist breit und flach.\u003cbr/>Nutze vollständige Sätze im Präsens. Schreibe sachlich und verbinde zusammengehörige Angaben."}, {"section": "Aus Stichwörtern wird Text", "title": "Ein vollständiges Beispiel", "text": "Der Fischotter\u003cbr/>\u003cbr/>Der Fischotter hat einen lang gestreckten Körper. Kopf und Rumpf sind zusammen etwa 60 bis 90 Zentimeter lang. Der Schwanz kommt noch dazu.\u003cbr/>\u003cbr/>Seine Beine sind kurz. Sein Fell ist oben dunkelbraun. Der Kopf ist breit und flach.\u003cbr/>\u003cbr/>Er lebt an Flüssen und Seen mit geschützten Ufern. Er frisst vor allem Fische, aber auch Frösche und Krebse."}, {"section": "Mit Kriterien prüfen", "title": "K1 | Informationen", "text": "Tiername, Maß mit Einheit und Bezug, Lebensraum und Nahrung sind richtig im Text enthalten."}, {"section": "Mit Kriterien prüfen", "title": "K2 | Aussehen", "text": "Mindestens vier verschiedene äußere Merkmale sind genau beschrieben. Wiederholungen desselben Merkmals zählen nicht doppelt."}, {"section": "Mit Kriterien prüfen", "title": "K3 | Aufbau", "text": "Beginne mit Tiername und Überblick, etwa Körperform oder Maß. Ordne zusammengehörige Informationen. Absätze helfen."}, {"section": "Mit Kriterien prüfen", "title": "K4 und K5 | Sprache", "text": "Schreibe sachlich und im Präsens. Nutze genaue Wörter. Verbinde vollständige, verständliche Sätze zu einem Text. Eine Stichwortliste reicht nicht."}, {"section": "Prüfen und überarbeiten", "title": "K6 | Schreibung", "text": "Prüfe Satzanfänge, Nomen und Satzschlüsse. Vergleiche schwierige Tierwörter mit dem Material. Zeige deine Prüfung: Kreise einen Satzanfang ein, unterstreiche zwei Nomen und markiere einen Satzschlusspunkt."}, {"section": "Prüfen und überarbeiten", "title": "Ein Beispiel prüfen", "text": "„sein kopf ist breit und flach“ wird zu: „Sein Kopf ist breit und flach.“ Groß: Sein, Kopf. Am Ende steht ein Punkt. Frage: Muss ein richtiger Satz verändert werden? Antwort: Nein. Zeige die Prüfung und begründe: „Mein Satz bleibt, weil …“. "}, {"section": "Prüfen und überarbeiten", "title": "Dein Abschluss", "text": "Die Probearbeit ist dein letzter Gelingensnachweis. Fünf Ziele: Informationen, vier Merkmale, Aufbau, Sprache, Schreibung mit sichtbarer Prüfung. Vier von fünf = 80 %. Danach bekommst du Feedback für deinen nächsten Schritt."}];let n=0;const $=id=>document.getElementById(id);function render(){const s=slides[n];$("section").textContent=s.section;$("title").textContent=s.title;$("text").innerHTML=s.text;$("photo").hidden=!s.photo;$("source").hidden=!s.photo;$("slide").value=n;$("count").textContent=(n+1)+" / "+slides.length;$("prev").disabled=n===0;$("next").disabled=n===slides.length-1;}$("prev").onclick=()=>{if(n>0)n--;render()};$("next").onclick=()=>{if(n<slides.length-1)n++;render()};$("slide").onchange=e=>{n=Number(e.target.value);render()};document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click()});render();</script></body></html>
