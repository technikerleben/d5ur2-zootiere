<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Etappe 2 · Sprache</title><style>*{box-sizing:border-box}body{margin:0;background:#eff5fa;color:#18324a;font:22px/1.45 system-ui}header,main,footer{max-width:1180px;margin:auto;padding:20px}header{border-bottom:5px solid #48dccb}h1{font-size:24px}h2{font-size:clamp(30px,4vw,46px);line-height:1.15}article{background:white;border-top:7px solid #245688;border-radius:12px;padding:28px 36px;min-height:360px}article p{font-size:clamp(24px,2.6vw,34px)}button,select{font:inherit;padding:10px 14px;min-height:48px;background:#245688;color:white;border:2px solid #245688;border-radius:8px}select{background:white;color:#18324a;max-width:100%}nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center}a{color:#245688}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #cf6320;outline-offset:3px}img{display:block;margin:auto;max-width:100%;max-height:48vh}footer{font-size:18px}.section{font-size:20px}.controls{margin-top:20px;display:flex;gap:15px;align-items:center;flex-wrap:wrap}[hidden]{display:none!important}@media(max-width:650px){article{padding:20px}header,main{padding:14px}}</style></head><body><header><h1>Etappe 2 · Sachlich und genau formulieren</h1><nav><a href="../../index.html#etappe2">Zum Cockpit</a><a href="Merkblatt_2_A5.pdf">Identisches Merkblatt</a><label for="slide">Abschnitt</label><select id="slide"><option value="0">1. Genau statt wertend · Sachlich beschreiben</option><option value="1">2. Genau statt wertend · Frage und Antwort</option><option value="2">3. Genau statt wertend · Genaue Wörter wählen</option><option value="3">4. Genau statt wertend · Wörter zusammensetzen</option><option value="4">5. Im Präsens beschreiben · Warum Präsens?</option><option value="5">6. Im Präsens beschreiben · Grundform und gebeugte Form</option><option value="6">7. Im Präsens beschreiben · Subjekt und Verb</option><option value="7">8. Vollständige Sätze · Ein vollständiger Satz</option><option value="8">9. Vollständige Sätze · Beispiel</option><option value="9">10. Vollständige Sätze · Frage und Antwort</option><option value="10">11. Sätze prüfen · Prüfe jeden Satz</option><option value="11">12. Sätze prüfen · Beispiel verbessern</option><option value="12">13. Sätze prüfen · Dein Gelingensnachweis</option></select></nav></header><main><article><p class="section" id="section"></p><h2 id="title"></h2><img id="photo" src="../gelingensnachweise/Fischotter_DavePape_Graustufen.jpg" alt="Fischotter mit kleinen Ohren und langen Tasthaaren an der Schnauze" hidden><p id="text"></p><p id="source" hidden><a href="https://commons.wikimedia.org/wiki/File:Lutra_lutra_1_-_Otter,_Owl,_and_Wildlife_Park.jpg">Bildquelle: Dave Pape · Public Domain</a></p></article><nav class="controls" aria-label="Folien"><button id="prev">Zurück</button><span id="count" aria-live="polite"></span><button id="next">Weiter</button></nav></main><footer>Lehrkraftansicht · Pfeiltasten zum Blättern · Fachlicher Inhalt wie Merkblatt 2.</footer><script>const slides=[{"section": "Genau statt wertend", "title": "Sachlich beschreiben", "text": "Beschreibe überprüfbare Merkmale. „Schön“ und „süß“ sagen nur, wie jemand etwas findet. Nutze Angaben aus deinem Material."}, {"section": "Genau statt wertend", "title": "Frage und Antwort", "text": "Was ist genauer: „schönes Fell“ oder „oben dunkelbraunes Fell“? Antwort: „oben dunkelbraunes Fell“. Die Farbe ist überprüfbar."}, {"section": "Genau statt wertend", "title": "Genaue Wörter wählen", "text": "Nutze genaue Nomen, Verben und Adjektive.\u003cbr/>„Das Tier bewegt sich im Wasser.“ wird genauer: „Der Fischotter schwimmt im Wasser.“\u003cbr/>„Sein Fell ist oben dunkelbraun.“ ist ebenfalls genau. Du musst „ist“ nicht immer ersetzen."}, {"section": "Genau statt wertend", "title": "Wörter zusammensetzen", "text": "Aus Fell und Farbe wird die Fellfarbe. Das letzte Wort bestimmt den Artikel: die Farbe → die Fellfarbe. Fachwörter benennen etwas genau. Kläre ihre Bedeutung."}, {"section": "Im Präsens beschreiben", "title": "Warum Präsens?", "text": "Tierbeschreibungen sagen, was allgemein für ein Tier gilt. Deshalb stehen sie meistens im Präsens, der Gegenwart: Der Fischotter lebt an Gewässern."}, {"section": "Im Präsens beschreiben", "title": "Grundform und gebeugte Form", "text": "Im Wörterbuch steht die Grundform: leben, fressen, sein.\u003cbr/>Im Satz beugst du das Verb passend:\u003cbr/>leben → er lebt\u003cbr/>fressen → er frisst\u003cbr/>sein → sein Fell ist dicht."}, {"section": "Im Präsens beschreiben", "title": "Subjekt und Verb", "text": "Das Subjekt ist der Satzgegenstand. Frage: Wer oder was schwimmt?\u003cbr/>Der Otter schwimmt. Die Otter schwimmen.\u003cbr/>Frage: Was ändert sich?\u003cbr/>Antwort: Bei mehreren Ottern heißt das Verb „schwimmen“ statt „schwimmt“."}, {"section": "Vollständige Sätze", "title": "Ein vollständiger Satz", "text": "Verbinde die Angaben zu einem verständlichen Satz. Achte darauf, dass Subjekt und Verb zusammenpassen: Der Fischotter lebt. Die Fischotter leben."}, {"section": "Vollständige Sätze", "title": "Beispiel", "text": "Wortgruppe: sein Fell – oben dunkelbraun – sein. Satz: Sein Fell ist oben dunkelbraun. Der Satz ist vollständig und verständlich."}, {"section": "Vollständige Sätze", "title": "Frage und Antwort", "text": "Was fehlt bei „Der Fischotter an einem See“? Antwort: das Verb. Vollständig heißt es: Der Fischotter lebt an einem See."}, {"section": "Sätze prüfen", "title": "Prüfe jeden Satz", "text": "Passt die Aussage zum Material? Ist der Satz vollständig? Steht das Verb im Präsens und passt es? Sind die Wörter genau? Beginnen Satz und Nomen groß? Steht am Ende ein Punkt?"}, {"section": "Sätze prüfen", "title": "Beispiel verbessern", "text": "„sein fell war schön“ wird zu: „Sein Fell ist oben dunkelbraun.“ Die Angabe stammt aus dem Material."}, {"section": "Sätze prüfen", "title": "Dein Gelingensnachweis", "text": "Du bildest drei Sätze und verbesserst einen Satz. Fünf Ziele: Materialtreue, vollständige Sätze, passende Verben im Präsens, genaue statt wertende Wörter, Großschreibung und Punkte. Bei vier von fünf Zielen kannst du weitergehen."}];let n=0;const $=id=>document.getElementById(id);function render(){const s=slides[n];$("section").textContent=s.section;$("title").textContent=s.title;$("text").innerHTML=s.text;$("photo").hidden=!s.photo;$("source").hidden=!s.photo;$("slide").value=n;$("count").textContent=(n+1)+" / "+slides.length;$("prev").disabled=n===0;$("next").disabled=n===slides.length-1;}$("prev").onclick=()=>{if(n>0)n--;render()};$("next").onclick=()=>{if(n<slides.length-1)n++;render()};$("slide").onchange=e=>{n=Number(e.target.value);render()};document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click()});render();</script></body></html>
