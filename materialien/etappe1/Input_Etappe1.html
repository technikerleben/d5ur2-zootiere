<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Etappe 1 · Informationen</title><style>*{box-sizing:border-box}body{margin:0;background:#eff5fa;color:#18324a;font:22px/1.45 system-ui}header,main,footer{max-width:1180px;margin:auto;padding:20px}header{border-bottom:5px solid #48dccb}h1{font-size:24px}h2{font-size:clamp(30px,4vw,46px);line-height:1.15}article{background:white;border-top:7px solid #245688;border-radius:12px;padding:28px 36px;min-height:360px}article p{font-size:clamp(24px,2.6vw,34px)}button,select{font:inherit;padding:10px 14px;min-height:48px;background:#245688;color:white;border:2px solid #245688;border-radius:8px}select{background:white;color:#18324a;max-width:100%}nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center}a{color:#245688}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #cf6320;outline-offset:3px}img{display:block;margin:auto;max-width:100%;max-height:48vh}footer{font-size:18px}.section{font-size:20px}.controls{margin-top:20px;display:flex;gap:15px;align-items:center;flex-wrap:wrap}[hidden]{display:none!important}@media(max-width:650px){article{padding:20px}header,main{padding:14px}}</style></head><body><header><h1>Etappe 1 · Informationen finden und ordnen</h1><nav><a href="../../index.html#etappe1">Zum Cockpit</a><a href="Merkblatt_1_A5.pdf">Identisches Merkblatt</a><label for="slide">Abschnitt</label><select id="slide"><option value="0">1. Genau statt wertend · Dein Ziel</option><option value="1">2. Genau statt wertend · Vergleiche</option><option value="2">3. Genau statt wertend · Frage</option><option value="3">4. Genau statt wertend · Gesicherte Antwort</option><option value="4">5. Das zeigt dir das Foto · Das Foto</option><option value="5">6. Das zeigt dir das Foto · Beobachte</option><option value="6">7. Das zeigt dir das Foto · Gesicherte Antwort</option><option value="7">8. Das zeigt dir das Foto · Grenze des Bildes</option><option value="8">9. Das erfährst du im Text · Lies gezielt</option><option value="9">10. Das erfährst du im Text · Frage</option><option value="10">11. Das erfährst du im Text · Gesicherte Antwort</option><option value="11">12. Sprachdetektiv · Vier Wortarten</option><option value="12">13. Sprachdetektiv · Wörter zerlegen</option><option value="13">14. Sprachdetektiv · Frage und gesicherte Antwort</option><option value="14">15. Informationen ordnen · So gehst du vor</option><option value="15">16. Informationen ordnen · Beispiel: geordnete Sammlung</option><option value="16">17. Informationen ordnen · Frage und gesicherte Antwort</option><option value="17">18. Informationen ordnen · Deine Etappe</option></select></nav></header><main><article><p class="section" id="section"></p><h2 id="title"></h2><img id="photo" src="../gelingensnachweise/Fischotter_DavePape_Graustufen.jpg" alt="Fischotter mit kleinen Ohren und langen Tasthaaren an der Schnauze" hidden><p id="text"></p><p id="source" hidden><a href="https://commons.wikimedia.org/wiki/File:Lutra_lutra_1_-_Otter,_Owl,_and_Wildlife_Park.jpg">Bildquelle: Dave Pape · Public Domain</a></p></article><nav class="controls" aria-label="Folien"><button id="prev">Zurück</button><span id="count" aria-live="polite"></span><button id="next">Weiter</button></nav></main><footer>Lehrkraftansicht · Pfeiltasten zum Blättern · Fachlicher Inhalt wie Merkblatt 1.</footer><script>const slides=[{"section": "Genau statt wertend", "title": "Dein Ziel", "text": "Du findest genaue Angaben über ein Tier. Eine Beschreibung hilft anderen, sich das Tier vorzustellen."}, {"section": "Genau statt wertend", "title": "Vergleiche", "text": "A: Der Fischotter ist toll. Sein Fell ist schön.\u003cbr/>B: Der Fischotter hat einen langen Körper und kurze Beine. Sein Fell ist oben dunkelbraun."}, {"section": "Genau statt wertend", "title": "Frage", "text": "Welcher Text hilft dir beim Vorstellen? Warum?"}, {"section": "Genau statt wertend", "title": "Gesicherte Antwort", "text": "B nennt Körperform, Beinlänge und Fellfarbe. A enthält Meinungen. „Schön“ und „toll“ sind keine genauen Merkmale."}, {"section": "Das zeigt dir das Foto", "title": "Das Foto", "photo": true, "text": "Foto: Dave Pape | Public Domain · Graustufenfassung"}, {"section": "Das zeigt dir das Foto", "title": "Beobachte", "text": "Zeige zwei Körperteile. Nenne jeweils ein genaues Merkmal."}, {"section": "Das zeigt dir das Foto", "title": "Gesicherte Antwort", "text": "An der Schnauze sitzen lange Tasthaare. Die Ohren sind klein. Zeige die passenden Bildstellen."}, {"section": "Das zeigt dir das Foto", "title": "Grenze des Bildes", "text": "Schwimmhäute und die gesamte Körperlänge erkennst du hier nicht sicher. Erfinde keine verdeckten Merkmale."}, {"section": "Das erfährst du im Text", "title": "Lies gezielt", "text": "Der Fischotter lebt an Flüssen und Seen mit geschützten Ufern. Er hat einen lang gestreckten Körper und kurze Beine. Sein Fell ist oben dunkelbraun. Sein Kopf ist breit und flach. An der Schnauze sitzen lange Tasthaare. Kopf und Rumpf sind zusammen etwa 60 bis 90 Zentimeter lang. Der Schwanz kommt noch dazu. Der Fischotter frisst vor allem Fische, aber auch Frösche und Krebse."}, {"section": "Das erfährst du im Text", "title": "Frage", "text": "Wo lebt der Fischotter? Was frisst er? Wie lang sind Kopf und Rumpf? Zählt der Schwanz dazu?"}, {"section": "Das erfährst du im Text", "title": "Gesicherte Antwort", "text": "Flüsse und Seen mit geschützten Ufern; vor allem Fische; Kopf und Rumpf etwa 60–90 cm. Der Schwanz zählt nicht dazu. Zeige die Textstellen."}, {"section": "Sprachdetektiv", "title": "Vier Wortarten", "text": "\u003cb>Nomen\u003c/b> benennen Tiere, Dinge und mehr: Otter, Fell. Du schreibst sie groß.\u003cbr/>\u003cb>Artikel\u003c/b> begleiten Nomen: der Otter, das Fell, die Pfote.\u003cbr/>\u003cb>Verben\u003c/b> sagen, was geschieht oder wie etwas ist: schwimmt, ist.\u003cbr/>\u003cb>Adjektive\u003c/b> beschreiben Merkmale: braun, dicht, lang."}, {"section": "Sprachdetektiv", "title": "Wörter zerlegen", "text": "der Körper + die Länge = die Körperlänge\u003cbr/>Das letzte Nomen bestimmt den Artikel."}, {"section": "Sprachdetektiv", "title": "Frage und gesicherte Antwort", "text": "„Der Otter schwimmt.“ Welche Wortarten findest du?\u003cbr/>Der: Artikel; Otter: Nomen; schwimmt: Verb."}, {"section": "Informationen ordnen", "title": "So gehst du vor", "text": "Lies den Auftrag. Suche passende Angaben in Bild und Text. Notiere Stichwörter unter Überschriften."}, {"section": "Informationen ordnen", "title": "Beispiel: geordnete Sammlung", "text": "Überblick: Fischotter; Kopf und Rumpf 60–90 cm, Schwanz zusätzlich\u003cbr/>Aussehen: langer Körper; kurze Beine; dunkelbraune Oberseite; lange Tasthaare\u003cbr/>Lebensraum: Flüsse und Seen; geschützte Ufer\u003cbr/>Nahrung: vor allem Fische"}, {"section": "Informationen ordnen", "title": "Frage und gesicherte Antwort", "text": "Wohin gehört „breiter, flacher Kopf“? Unter Aussehen. Eine genaue Angabe kann im Bild und im Text vorkommen. Zeige, welche Quelle du genutzt hast."}, {"section": "Informationen ordnen", "title": "Deine Etappe", "text": "Bearbeite die Pflichtaufgaben auf Blatt 1–4. Vertiefungen sind freiwillig. Danach zeigst du dein Können im Nachweis: vier von fünf Zielen reichen für die nächste Etappe."}];let n=0;const $=id=>document.getElementById(id);function render(){const s=slides[n];$("section").textContent=s.section;$("title").textContent=s.title;$("text").innerHTML=s.text;$("photo").hidden=!s.photo;$("source").hidden=!s.photo;$("slide").value=n;$("count").textContent=(n+1)+" / "+slides.length;$("prev").disabled=n===0;$("next").disabled=n===slides.length-1;}$("prev").onclick=()=>{if(n>0)n--;render()};$("next").onclick=()=>{if(n<slides.length-1)n++;render()};$("slide").onchange=e=>{n=Number(e.target.value);render()};document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click()});render();</script></body></html>
