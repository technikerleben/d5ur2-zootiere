<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2C3D4C">
<meta name="color-scheme" content="light">
<meta name="description" content="Lernbegleiter zur Deutsch-Reihe Zootiere, Jahrgang 5: Tiere sachlich beschreiben.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zootiere">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Zootiere lernen</title>
<style>
__FONTS__
:root{
  --slate-dark:#2C3D4C; --slate:#3E5668; --slate-mid:#6A8599; --slate-pale:#D0DCE6; --slate-ghost:#EEF3F7;
  --rust-dark:#9E4E22; --rust:#D97A4A; --rust-pale:#F5DDD1; --rust-ghost:#FBF0EB;
  --sage-dark:#3F7533; --sage:#7DBB6F; --sage-pale:#D8ECD2; --sage-ghost:#EFF7EC;
  --bg:#F5F4F1; --card:#FFFFFF; --text:#1E2A35; --muted:#55626E; --line:#DAD7D0;
  --radius:16px; --tab-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:72px;scroll-padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 16px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Andika",system-ui,sans-serif;font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button,a,input,textarea,.fb{scroll-margin-top:76px;scroll-margin-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 20px)}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* Kopf */
header.top{position:sticky;top:0;z-index:20;background:var(--slate-dark);color:#fff;padding-top:var(--safe-t)}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:19px;line-height:1.2}
.brand span{display:block;font-size:14px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:48px;height:48px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.iconbtn svg{width:24px;height:24px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 14px 0 8px;margin:12px 0 4px;border-radius:12px;border:2px solid var(--slate-pale);background:var(--card);font-weight:700;color:var(--slate-dark);text-decoration:none}

main.wrap{padding-bottom:calc(var(--tab-h) + var(--safe-b) + 28px)}
h1{font-size:25px;line-height:1.25;margin:18px 0 6px;color:var(--slate-dark)}
h2{font-size:21px;line-height:1.3;margin:24px 0 10px;color:var(--slate-dark)}
h3{font-size:19px;line-height:1.3;margin:0 0 8px;color:var(--slate-dark)}
p{margin:0 0 10px}
.lead{color:var(--muted);margin-bottom:14px}
.small{font-size:15px;color:var(--muted)}

/* Karten */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:0 1px 0 rgba(0,0,0,.04),0 2px 10px rgba(44,61,76,.06);border:1px solid #ECEAE5}
.card.next{border:2px solid var(--rust);background:var(--rust-ghost)}
.card.calm{background:var(--slate-ghost);border-color:var(--slate-pale)}
.cardhead{display:flex;align-items:flex-start;gap:8px}
.cardhead h3{flex:1}
.label{display:inline-block;font-size:14px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--slate);margin:12px 0 2px}
.label:first-child{margin-top:0}
.frage{background:var(--rust-ghost);border-left:5px solid var(--rust);border-radius:10px;padding:10px 12px;margin:10px 0}
.frage .label{color:var(--rust-dark)}
.antwort{background:var(--sage-ghost);border-left:5px solid var(--sage);border-radius:10px;padding:10px 12px;margin:10px 0}
.antwort .label{color:var(--sage-dark)}
.figure{margin:10px 0;border-radius:12px;overflow:hidden;background:var(--slate-ghost)}
.figure img{display:block;width:100%;height:auto}
.cred{font-size:13px;color:var(--muted);padding:4px 8px}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:2px solid var(--slate-pale);background:var(--card);font-weight:700;color:var(--slate-dark);text-align:center;text-decoration:none}
.btn.primary{background:var(--rust-dark);border-color:var(--rust-dark);color:#fff}
.btn.ghost{background:transparent}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.say{flex:none;min-width:48px;min-height:48px;border-radius:12px;border:2px solid var(--slate-pale);background:var(--card);display:grid;place-items:center;color:var(--slate)}
.say svg{width:22px;height:22px}
.say.on{background:var(--slate);color:#fff;border-color:var(--slate)}

/* Tab-Leiste */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tab-h);color:var(--muted);text-decoration:none;font-size:13px;font-weight:700;border-top:3px solid transparent}
nav.tabs a svg{width:26px;height:26px}
nav.tabs a[aria-current="page"]{color:var(--slate-dark);border-top-color:var(--rust)}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:8px 14px;border-radius:999px;border:2px solid var(--slate-pale);background:var(--card);font-weight:700;color:var(--slate-dark);text-decoration:none;display:inline-flex;align-items:center}
.chip[aria-current="true"]{background:var(--slate-dark);border-color:var(--slate-dark);color:#fff}

/* Weg */
.station{padding:0;overflow:hidden}
.station summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:64px;cursor:pointer}
.station summary::-webkit-details-marker{display:none}
.num{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--slate-ghost);color:var(--slate-dark);font-weight:700;border:2px solid var(--slate-pale)}
.station.voll .num{background:var(--sage-dark);color:#fff;border-color:var(--sage-dark)}
.station summary .t{flex:1;font-weight:700;line-height:1.3}
.station summary .p{font-size:15px;color:var(--muted);white-space:nowrap}
.station .inner{padding:0 16px 16px}
.check{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 4px;border-top:1px solid #EFEDE8;cursor:pointer}
.check input{width:26px;height:26px;flex:none;accent-color:var(--sage-dark)}
.check.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--sage)}

/* Üben-Liste */
.exlink{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 14px;background:var(--card);border-radius:14px;border:1px solid #ECEAE5;margin:8px 0;text-decoration:none;color:var(--text)}
.exlink .t{flex:1}
.exlink b{display:block;line-height:1.3}
.exlink span{font-size:15px;color:var(--muted)}
.badge{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--slate-pale);color:transparent}
.badge.ok{background:var(--sage-dark);border-color:var(--sage-dark);color:#fff}
.badge svg{width:18px;height:18px}

/* Auswahl */
.prog{display:flex;align-items:center;gap:10px;margin:6px 0 4px;font-size:15px;color:var(--muted)}
.bar{flex:1;height:8px;border-radius:99px;background:var(--slate-pale);overflow:hidden}
.bar i{display:block;height:100%;background:var(--slate)}
.item{font-size:20px;line-height:1.45;background:var(--card);border-radius:var(--radius);padding:18px 16px;margin:12px 0;border:2px solid var(--slate-pale)}
.opts{display:grid;gap:10px}
.opts.grid{grid-template-columns:1fr 1fr}
.opt{min-height:56px;padding:12px 14px;border-radius:14px;border:2px solid var(--slate-pale);background:var(--card);font-weight:700;text-align:left;line-height:1.35;color:var(--text)}
.opts.grid .opt{text-align:center}
.opts.grid .opt:last-child:nth-child(odd){grid-column:1 / -1}
.opt.ok{background:var(--sage-pale);border-color:var(--sage-dark)}
.opt.no{background:var(--rust-pale);border-color:var(--rust-dark)}
.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:12px 14px;margin:12px 0}
.fb.ok{background:var(--sage-ghost);border:2px solid var(--sage)}
.fb.no{background:var(--rust-ghost);border:2px solid var(--rust)}
.fb b{display:block}
.siehe{font-size:15px;color:var(--slate);margin-top:6px}

/* Interview-Detektiv */
.status{position:sticky;top:56px;z-index:10;background:var(--bg);padding:8px 0}
.status .card{margin:0;padding:10px 14px;display:flex;align-items:center;gap:10px}
.iv{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid #ECEAE5}
.iv .q{font-weight:700;color:var(--slate-dark);margin:16px 0 4px}
.iv .q:first-of-type{margin-top:4px}
.iv .a{margin:0 0 6px;line-height:1.75}
.seg{display:inline;font:inherit;line-height:inherit;padding:2px 2px;margin:0;border:0;background:transparent;color:inherit;text-align:left;text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--rust);border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg.sel{background:var(--rust-pale)}
.seg.done{text-decoration:none;background:var(--sage-pale)}
.seg.weg{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted);background:#EEEDEA}
.seg sup{font-size:12px;font-weight:700;color:#fff;background:var(--sage-dark);border-radius:6px;padding:1px 5px;margin-left:3px;vertical-align:2px}
.seg.weg sup{background:var(--muted)}
.fiktiv{font-size:14px;color:var(--muted);margin-top:12px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(30,42,53,.2);padding:14px 0 calc(16px + var(--safe-b));transform:translateY(105%);transition:transform .2s ease}
.sheet.open{transform:none}
.sheet .zit{font-style:italic;background:var(--slate-ghost);border-radius:10px;padding:8px 12px;margin:6px 0 12px;max-height:30vh;overflow:auto}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(30,42,53,.35);display:none}
.scrim.open{display:block}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}

/* Satzbau, Fehlerjagd, Rätsel */
.pool,.answer{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;padding:10px;border-radius:14px}
.pool{background:var(--slate-ghost)}
.answer{background:var(--card);border:2px dashed var(--slate-pale);margin:10px 0}
.tile{min-height:48px;min-width:48px;padding:8px 14px;border-radius:12px;border:2px solid var(--slate);background:var(--card);font-weight:700;color:var(--slate-dark)}
.answer .tile{border-color:var(--rust-dark)}
.answer.ok{border-style:solid;border-color:var(--sage-dark);background:var(--sage-ghost)}
.answer.no{border-style:solid;border-color:var(--rust);background:var(--rust-ghost)}
.words{display:flex;flex-wrap:wrap;gap:8px;font-size:20px}
.word{min-height:48px;padding:6px 12px;border-radius:12px;border:2px solid var(--slate-pale);background:var(--card)}
.word.mark{border-color:var(--rust-dark);background:var(--rust-pale)}
.word.end{color:var(--muted);font-size:16px;font-weight:700}
.word.r{border-color:var(--sage-dark);background:var(--sage-pale)}
.word.miss{border-color:var(--rust-dark);border-style:dashed;background:var(--rust-ghost)}
.word.false{text-decoration:line-through;color:var(--muted);background:#EEEDEA}
.sent{display:block;width:100%;text-align:left;min-height:56px;padding:12px 14px;margin:8px 0;border-radius:14px;border:2px solid var(--slate-pale);background:var(--card);line-height:1.4}
.sent.mark{border-color:var(--rust-dark);background:var(--rust-pale)}
.sent.r{border-color:var(--sage-dark);background:var(--sage-pale)}
.sent.miss{border-color:var(--rust-dark);border-style:dashed}
.sent small{display:block;font-size:15px;color:var(--muted);margin-top:4px}
.slots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:14px 0}
.slot{width:34px;height:46px;border-radius:9px;border:2px solid var(--slate);background:var(--card);font-size:21px;font-weight:700;display:grid;place-items:center}
.slot:empty{border-style:dashed;border-color:var(--slate-pale)}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.letter{width:48px;height:52px;border-radius:12px;border:2px solid var(--slate);background:var(--slate-ghost);font-size:22px;font-weight:700;padding:0}
.letter:disabled{visibility:hidden}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}

/* Formular */
.field{margin:12px 0}
.field label{display:block;font-weight:700;font-size:16px;margin-bottom:4px;color:var(--slate-dark)}
.field textarea{width:100%;min-height:56px;padding:10px 12px;border-radius:12px;border:2px solid var(--slate-pale);background:var(--card);resize:vertical;font-size:18px}
ol.steps,ul.plain{margin:6px 0 0;padding-left:24px}
ol.steps li,ul.plain li{margin:4px 0}
.ideas{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ideas span{padding:6px 12px;border-radius:999px;background:var(--slate-ghost);border:1px solid var(--slate-pale);font-size:16px}
table.wh{width:100%;border-collapse:collapse;font-size:17px}
table.wh td{border-top:1px solid var(--line);padding:8px 4px;vertical-align:top}
table.wh td:first-child{font-weight:700;width:38%}
.done-card{text-align:center;padding:22px 16px}
.done-card .big{font-size:40px;line-height:1}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><b id="appTitle"></b><span id="appSub"></span></div>
  <a class="iconbtn" href="#/info" aria-label="Infos für Eltern und Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.2"/></svg></a>
</div></header>
<main id="main" class="wrap" tabindex="-1"></main>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="wrap" id="sheetBody"></div></div>
<nav class="tabs" aria-label="Bereiche"><div class="wrap">
  <a href="#/weg" data-tab="weg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg>Mein Weg</a>
  <a href="#/wissen" data-tab="wissen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 5.5C6 4 9 4 12 6c3-2 6-2 9-.5V19c-3-1.5-6-1.5-9 .5-3-2-6-2-9-.5z"/><path d="M12 6v13.5"/></svg>Wissen</a>
  <a href="#/ueben" data-tab="ueben"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l5 5L9 20H4v-5z"/><path d="M13 6l5 5"/></svg>Üben</a>
  <a href="#/raetsel" data-tab="raetsel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><path d="M15.5 15.5h3v3h-3z"/></svg>Rätsel</a>
  <a href="#/zuhause" data-tab="zuhause"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Zuhause</a>
</div></nav>

<script>
(function(){
"use strict";
const D = __DATA__;
const IMG = __IMAGES__;

/* ---------- Speicher (nur auf diesem Gerät) ---------- */
const KEY = "zootiere-lernapp:v1";
let S = {weg:{}, ex:{}, raetsel:{}, plan:{}, check:{}};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

/* ---------- Hilfen ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function md(t){
  return esc(t).replace(/\*\*\*(.+?)\*\*(.+?)\*/g, "<i><b>$1</b>$2</i>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/\n/g, "<br>");
}
const plain = t => String(t).replace(/\[\[([^|\]]+)\|[^\]]+\]\]/g, "$1").replace(/\*+/g, "").replace(/\n/g, " ");
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_SAY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';

/* ---------- Vorlesen (Browser-Stimme, offline) ---------- */
const TTS = "speechSynthesis" in window;
function sayBtn(text){ return TTS ? '<button class="say" type="button" data-say="' + esc(plain(text)) + '" aria-label="Vorlesen">' + ICON_SAY + '</button>' : ""; }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-say]"); if (!b) return;
  const ss = window.speechSynthesis;
  if (b.classList.contains("on")) { ss.cancel(); b.classList.remove("on"); return; }
  ss.cancel(); document.querySelectorAll(".say.on").forEach(x => x.classList.remove("on"));
  const u = new SpeechSynthesisUtterance(b.dataset.say); u.lang = "de-DE"; u.rate = 0.92;
  const v = ss.getVoices().find(v => /^de/i.test(v.lang)); if (v) u.voice = v;
  u.onend = u.onerror = () => b.classList.remove("on");
  b.classList.add("on"); ss.speak(u);
});

/* ---------- Bottom-Sheet ---------- */
function openSheet(html){ $("#sheetBody").innerHTML = html; $("#sheet").classList.add("open"); $("#scrim").classList.add("open"); const f = $("#sheet button"); if (f) f.focus(); }
function closeSheet(){ $("#sheet").classList.remove("open"); $("#scrim").classList.remove("open"); $("#sheetBody").innerHTML = ""; }
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* ---------- Router ---------- */
const M = $("#main");
$("#appTitle").textContent = D.app.titel; $("#appSub").textContent = D.app.untertitel;
function route(){
  closeSheet(); if (TTS) speechSynthesis.cancel();
  const p = (location.hash.replace(/^#\/?/, "") || "weg").split("/");
  const tab = {weg:1, wissen:1, ueben:1, raetsel:1, zuhause:1}[p[0]] ? p[0] : (p[0] === "info" ? "" : "weg");
  document.querySelectorAll("nav.tabs a").forEach(a => { if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (p[0] === "info") viewInfo();
  else if (p[0] === "wissen") viewWissen(p[1] || "e1");
  else if (p[0] === "ueben" && p[1]) viewExercise(p[1]);
  else if (p[0] === "ueben") viewUeben();
  else if (p[0] === "raetsel") viewRaetsel();
  else if (p[0] === "zuhause") viewZuhause();
  else viewWeg();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ---------- Mein Weg ---------- */
function viewWeg(){
  const st = D.weg;
  let next = null;
  for (const s of st) { for (let i = 0; i < s.punkte.length; i++) { if (!S.weg[s.id + ":" + i]) { next = {s, i}; break; } } if (next) break; }
  let h = '<h1>Mein Weg</h1><p class="lead">' + md(D.start.hallo) + '</p>';
  if (next) {
    h += '<div class="card next"><span class="label">Dein nächster Schritt</span><h3>' + esc(next.s.punkte[next.i]) + '</h3><p class="small">' + esc(next.s.titel) + '</p>';
    if (next.s.ueben) h += '<a class="btn primary" href="#/ueben">Passende Übungen</a>';
    h += '</div>';
  } else {
    h += '<div class="card next"><h3>Alles abgehakt!</h3><p>Du hast den ganzen Weg geschafft.</p></div>';
  }
  st.forEach((s, n) => {
    const done = s.punkte.filter((_, i) => S.weg[s.id + ":" + i]).length;
    const open = next && next.s === s;
    h += '<details class="card station' + (done === s.punkte.length ? " voll" : "") + '"' + (open ? " open" : "") + '><summary><span class="num">' + (done === s.punkte.length ? ICON_OK : (n + 1)) + '</span><span class="t">' + esc(s.titel) + '</span><span class="p">' + done + '/' + s.punkte.length + '</span></summary><div class="inner">';
    if (s.text) h += '<p class="small">' + md(s.text) + '</p>';
    s.punkte.forEach((pk, i) => {
      const k = s.id + ":" + i, c = !!S.weg[k];
      h += '<label class="check' + (c ? " done" : "") + '"><input type="checkbox" data-k="' + k + '"' + (c ? " checked" : "") + '><span>' + esc(pk) + '</span></label>';
    });
    const links = [];
    if (s.wissen) links.push('<a class="btn ghost" href="#/wissen/' + s.wissen + '">Merkkarten</a>');
    if (s.ueben) links.push('<a class="btn ghost" href="#/ueben">Übungen</a>');
    if (links.length) h += '<div class="row">' + links.join("") + '</div>';
    h += '</div></details>';
  });
  h += '<p class="small">' + md(D.start.hinweis_haken) + '</p>';
  M.innerHTML = h;
  M.querySelectorAll("input[data-k]").forEach(cb => cb.addEventListener("change", () => {
    if (cb.checked) S.weg[cb.dataset.k] = 1; else delete S.weg[cb.dataset.k];
    save(); const y = window.scrollY; viewWeg(); window.scrollTo(0, y);
    const again = M.querySelector('input[data-k="' + cb.dataset.k + '"]'); if (again) again.focus();
  }));
}

  let h = '<h1>Wissen</h1><div class="chips" role="tablist">' + chips.map(c => '<a class="chip" href="#/wissen/' + c[0] + '"' + (c[0] === part ? ' aria-current="true"' : "") + '>' + c[1] + '</a>').join("") + '</div>';
  const et = D.wissen.etappen.find(e => "e" + e.etappe === part);
  if (et) {
    h += '<p class="lead"><b>' + esc(et.titel) + '</b><br>Ziel: ' + md(et.ziel) + '</p>';
    et.abschnitte.forEach((a, ai) => {
      h += '<section class="card"><div class="cardhead"><h3>' + (ai + 1) + ' · ' + esc(a.titel) + '</h3>' + sayBtn(a.titel + ". " + a.bloecke.filter(b => b[0] !== "Gesicherte Antwort").map(b => b[0] + ": " + b[1]).join(". ")) + '</div>';
      if (a.bild) h += figure(a.bild);
      a.bloecke.forEach((b, bi) => {
        if (b[0] === "Frage") h += '<div class="frage"><span class="label">Frage</span><div>' + md(b[1]) + '</div></div>';
        else if (b[0] === "Gesicherte Antwort") h += '<button class="btn block" type="button" data-reveal="r' + ai + "_" + bi + '">Antwort zeigen</button><div class="antwort" id="r' + ai + "_" + bi + '" hidden><span class="label">Gesicherte Antwort</span><div>' + md(b[1]) + '</div></div>';
        else h += '<span class="label">' + esc(b[0]) + '</span><div>' + md(b[1]) + '</div>';
      });
      h += '</section>';
    });
    h += '<div class="card calm">' + md(et.abschluss) + '</div>';
  } else if (part === "strategien") {
    h += '<p class="lead">Diese Karten legst du in der Schule an deinen Lernbuddy. Hier kannst du sie nachlesen.</p>';
    D.wissen.strategien.forEach(k => {
      h += '<section class="card"><div class="cardhead"><h3>' + k.nr + ' · ' + esc(k.titel) + '</h3>' + (k.schritte.length ? sayBtn(k.titel + ". " + k.wann + " " + k.schritte.join(". ")) : "") + '</div>';
      if (k.wann) h += '<span class="label">Wann?</span><div>' + md(k.wann) + '</div>';
      if (k.schritte.length) h += '<span class="label">So geht es</span><ol class="steps">' + k.schritte.map(s => '<li>' + md(s) + '</li>').join("") + '</ol>';
      if (k.beispiel) h += '<span class="label">Beispiel</span><div>' + md(k.beispiel) + '</div>';
      if (!k.schritte.length) h += '<p class="small">Schreibe deine eigene Strategie auf die leere Karte in der Schule.</p>';
      h += '</section>';
    });
  } else if (part === "pruefen") {
    h += '<p class="lead">Damit prüfst du deine Tierbeschreibung.</p>';
    D.wissen.checkliste.forEach(g => {
      h += '<section class="card"><h3>' + esc(g.titel) + '</h3>' + g.teile.map(t => '<span class="label">' + esc(t.titel) + '</span><div>' + md(t.text) + '</div>').join("") + '</section>';
    });
  } else {
    const w = D.wissen.woerter;
    h += '<p class="lead">' + md(w.hinweis) + '</p><section class="card"><h3>' + esc(w.titel) + '</h3><table class="wh"><tbody>' + w.tabelle.zeilen.map(r => '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>').join("") + '</tbody></table></section>';
    w.listen.forEach(l => { h += '<section class="card"><h3>' + esc(l[0]) + '</h3><div>' + md(l[1]) + '</div></section>'; });

  }
  M.innerHTML = h;
  M.querySelectorAll("[data-reveal]").forEach(b => b.addEventListener("click", () => { $("#" + b.dataset.reveal).hidden = false; b.remove(); }));

}
function figure(key){
  const im = IMG[key]; if (!im) return "";

}

/* Auswahl: eine Karte nach der anderen */
function exAuswahl(u, box){
  const items = u.items.map((it, n) => Object.assign({n}, it));
  let i = 0; const schwer = [];
  function opts(it){ return it.optionen ? it.optionen.map((o, k) => [k, o]) : u.optionen; }
  function lab(it, id){ const o = opts(it).find(x => x[0] === id); return o ? o[1] : id; }
  function show(){
    const it = items[i], os = opts(it);
    const grid = os.length > 3 && os.every(o => plain(o[1]).length <= 16);
    let h = '<div class="prog"><span>Karte ' + (i + 1) + ' von ' + items.length + '</span><span class="bar"><i style="width:' + Math.round(i / items.length * 100) + '%"></i></span></div>';
    if (u.bild) h += figure(u.bild);
    h += '<div class="item">' + md(it.text) + '</div><div class="opts' + (grid ? " grid" : "") + '">' + os.map(o => '<button class="opt" type="button" data-o="' + esc(o[0]) + '">' + md(o[1]) + '</button>').join("") + '</div><div id="fb"></div>';
    box.innerHTML = h;
    box.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => pick(b)));
  }
  function pick(b){
    const it = items[i], val = it.optionen ? Number(b.dataset.o) : b.dataset.o, ok = val === it.richtig;
    box.querySelectorAll(".opt").forEach(x => { x.disabled = true; const v = it.optionen ? Number(x.dataset.o) : x.dataset.o; if (v === it.richtig) x.classList.add("ok"); });
    if (!ok) { b.classList.add("no"); schwer.push(it); }
    $("#fb").innerHTML = '<div class="fb ' + (ok ? "ok" : "no") + '" role="status"><b>' + (ok ? "Richtig!" : "Noch nicht. Richtig ist: " + plain(lab(it, it.richtig))) + '</b>' + md(it.erklaerung) + '</div><button class="btn primary block" type="button" id="weiter">' + (i + 1 < items.length ? "Weiter" : "Fertig") + '</button>';
    $("#weiter").addEventListener("click", () => { i++; if (i < items.length) { show(); box.scrollIntoView({block: "start"}); } else end(); });
    $("#weiter").focus({preventScroll: true});
    $("#weiter").scrollIntoView({block: "nearest"});
  }
  function end(){
    let x = '<p>Du hast alle ' + items.length + ' Karten bearbeitet.</p>';
    if (schwer.length) x += '<div class="card calm" style="text-align:left"><b>Schau dir diese Karten noch einmal an:</b><ul class="plain">' + schwer.map(it => '<li>' + md(it.text) + '</li>').join("") + '</ul></div>';
    else x += '<p>Alles beim ersten Versuch richtig.</p>';
    finish(u, box, x);
  }
  show();
}

/* Interview-Detektiv */
function exDetektiv(u, box){
  const iv = D.interviews[u.interview];
  const segs = []; const tried = {};
  const want = k => (["W", "X", "V", "U"].includes(k) ? "weg" : k);
  let h = '<div class="status"><div class="card"><span id="cnt" style="flex:1"></span><button class="btn ghost" type="button" id="hilfe" style="min-height:44px;padding:6px 12px">Hilfe</button></div></div><article class="iv"><h3>' + md(iv.titel) + '</h3><p class="small">' + md(iv.einleitung) + '</p>';
  function ivHtml(raw){
    const re = /\[\[([^|\]]+)\|([^\]]+)\]\]/g; let out = "", last = 0, m;
    while ((m = re.exec(raw))) {
      out += esc(raw.slice(last, m.index));
      if (u.kuerzel.includes(m[2])) { segs.push({t: m[1], k: m[2]}); out += '<button class="seg" type="button" data-s="' + (segs.length - 1) + '">' + esc(m[1]) + '</button>'; }
      else out += esc(m[1]);
      last = re.lastIndex;
    }
    return out + esc(raw.slice(last));
  }
  iv.paare.forEach(p => { h += '<p class="q">' + md(p[0]) + '</p><p class="a">' + ivHtml(p[1]) + '</p>'; });
  if (iv.woerter && iv.woerter.length) h += '<p class="q">Wörterhilfe</p><p class="a small">' + iv.woerter.map(w => '<b>' + esc(w[0]) + '</b> = ' + esc(w[1])).join("<br>") + '</p>';
  h += '<p class="fiktiv">' + esc(D.hinweis_fiktiv) + '</p></article><div id="fertig"></div>';
  box.innerHTML = h;
  const done = {};
  const count = () => { const n = Object.keys(done).length; $("#cnt").innerHTML = '<b>' + n + '</b> von ' + segs.length + ' Stellen'; return n; };
  count();
  $("#hilfe").addEventListener("click", () => openSheet('<h3 id="sheetTitle">So geht es</h3><p>' + md(u.intro) + '</p><p>Frag bei jeder Stelle: <b>Gilt das für alle Tiere dieser Art?</b> Wenn nicht, streichst du sie. Meinungen, Vergleiche und Erlebnisse mit ' + esc(u.zootier) + ' streichst du auch.</p><button class="btn primary block" type="button" data-close>Verstanden</button>'));
  box.querySelectorAll(".seg").forEach(b => b.addEventListener("click", () => ask(b)));
  document.getElementById("sheetBody").onclick = e => { if (e.target.closest("[data-close]")) closeSheet(); };
  function ask(b){
    const n = +b.dataset.s, sg = segs[n];
    if (done[n]) return;
    box.querySelectorAll(".seg.sel").forEach(x => x.classList.remove("sel")); b.classList.add("sel");
    openSheet('<h3 id="sheetTitle">Wohin gehört diese Stelle?</h3><div class="zit">' + esc(sg.t) + '</div><div class="opts grid">' + u.optionen.map(o => '<button class="opt" type="button" data-o="' + o[0] + '">' + esc(o[1]) + '</button>').join("") + '</div><div id="sfb"></div>');
    $("#sheetBody").querySelectorAll(".opt").forEach(o => o.addEventListener("click", () => {
      const ok = o.dataset.o === want(sg.k);
      tried[n] = (tried[n] || 0) + (ok ? 0 : 1);
      if (ok) {
        done[n] = 1; b.classList.remove("sel"); b.classList.add(want(sg.k) === "weg" ? "weg" : "done");
        const lab = u.optionen.find(x => x[0] === want(sg.k))[1];
        b.insertAdjacentHTML("beforeend", '<sup>' + (want(sg.k) === "weg" ? "weg" : esc(lab)) + '</sup>');
        b.setAttribute("aria-label", sg.t + " – " + lab);
        $("#sheetBody").querySelectorAll(".opt").forEach(x => x.disabled = true); o.classList.add("ok");
        $("#sfb").innerHTML = '<div class="fb ok" role="status">' + md(D.detektiv_rueckmeldung[sg.k].replace("{zootier}", u.zootier)) + '</div><button class="btn primary block" type="button" data-close>Weiter</button>';
        $("#sfb [data-close]").focus();
        if (count() === segs.length) { closeSheet(); $("#fertig").innerHTML = ""; finish(u, $("#fertig"), '<p>Du hast alle ' + segs.length + ' Stellen zugeordnet.</p>'); }
      } else {
        o.classList.add("no"); o.disabled = true;
        const tip = tried[n] >= 2 ? '<b>Tipp:</b> ' + md(D.detektiv_rueckmeldung[sg.k].replace(/^Richtig: /, "").replace("{zootier}", u.zootier)) : 'Lies die Stelle noch einmal. Gilt sie für alle Tiere dieser Art?';
        $("#sfb").innerHTML = '<div class="fb no" role="status"><b>Noch nicht.</b>' + tip + '</div>';
      }
    }));
  }
}

/* Satzbau */
function exSatzbau(u, box){
  let i = 0;
  function show(){
    const it = u.items[i]; let pool = it.teile.map((t, k) => ({t, k}));
    do { pool = shuffle(pool); } while (pool.length > 1 && pool.every((p, k) => p.k === k));
    const ans = [];
    function draw(state){
      let h = '<div class="prog"><span>Satz ' + (i + 1) + ' von ' + u.items.length + '</span><span class="bar"><i style="width:' + Math.round(i / u.items.length * 100) + '%"></i></span></div>';
      h += '<span class="label">Dein Satz</span><div class="answer' + (state ? " " + state : "") + '" aria-live="polite">' + ans.map((p, k) => '<button class="tile" type="button" data-a="' + k + '"' + (state ? " disabled" : "") + '>' + esc(p.t) + '</button>').join("") + '</div>';
      h += '<span class="label">Wortkarten</span><div class="pool">' + pool.map((p, k) => '<button class="tile" type="button" data-p="' + k + '">' + esc(p.t) + '</button>').join("") + '</div><div id="fb"></div>';
      if (!state) h += '<div class="row"><button class="btn primary" type="button" id="pruefen"' + (pool.length ? " disabled" : "") + '>Prüfen</button></div>';
      box.innerHTML = h;
      box.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => { ans.push(pool.splice(+b.dataset.p, 1)[0]); draw(); }));
      box.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => { pool.push(ans.splice(+b.dataset.a, 1)[0]); draw(); }));
      const pr = $("#pruefen"); if (pr) pr.addEventListener("click", check);
    }
    function check(){
      const ok = ans.every((p, k) => p.k === k);
      draw(ok ? "ok" : "no");
      const satz = it.teile.join(" ").replace(/ \./, ".");
      if (ok) {
        $("#fb").innerHTML = '<div class="fb ok" role="status"><b>Richtig: ' + esc(satz) + '</b>' + md(it.erklaerung) + '</div><button class="btn primary block" type="button" id="weiter">' + (i + 1 < u.items.length ? "Nächster Satz" : "Fertig") + '</button>';
        $("#weiter").addEventListener("click", () => { i++; i < u.items.length ? show() : finish(u, box, '<p>Du hast ' + u.items.length + ' Sätze gebaut.</p>'); }); $("#weiter").scrollIntoView({block: "nearest"});
      } else {
        $("#fb").innerHTML = '<div class="fb no" role="status"><b>Noch nicht ganz.</b>Beginne mit dem Subjekt: Wer oder was? Das Verb steht an zweiter Stelle. Der Punkt kommt ans Ende.</div><div class="row"><button class="btn primary" type="button" id="nochmal">Noch einmal</button><button class="btn" type="button" id="loes">Lösung zeigen</button></div>';
        $("#nochmal").addEventListener("click", () => { pool = pool.concat(ans.splice(0)); draw(); });
        $("#loes").addEventListener("click", () => { $("#fb").innerHTML = '<div class="fb ok"><b>' + esc(satz) + '</b>' + md(it.erklaerung) + '</div><button class="btn primary block" type="button" id="weiter">' + (i + 1 < u.items.length ? "Nächster Satz" : "Fertig") + '</button>'; $("#weiter").addEventListener("click", () => { i++; i < u.items.length ? show() : finish(u, box, '<p>Du hast ' + u.items.length + ' Sätze gebaut.</p>'); }); $("#weiter").scrollIntoView({block: "nearest"}); });
      }
    }
    draw();
  }
  show();
}

/* Fehlerjagd */
function exFehler(u, box){
  let i = 0;
  function show(){
    const it = u.items[i], f = it.falsch.split(" "), r = it.richtig.split(" ");
    const strip = w => w.replace(/[.!?]$/, "");
    const wrong = new Set(); f.forEach((w, k) => { if (strip(w) !== strip(r[k])) wrong.add(k); });
    const endWrong = !/[.!?]$/.test(it.falsch) && /[.!?]$/.test(it.richtig);
    if (endWrong) wrong.add("end");
    const marked = new Set();
    let h = '<div class="prog"><span>Satz ' + (i + 1) + ' von ' + u.items.length + '</span><span class="bar"><i style="width:' + Math.round(i / u.items.length * 100) + '%"></i></span></div><div class="item"><div class="words">'
      + f.map((w, k) => '<button class="word" type="button" data-w="' + k + '" aria-pressed="false">' + esc(w) + '</button>').join("") + '<button class="word end" type="button" data-w="end" aria-pressed="false">Ende</button></div></div><div id="fb"></div><div class="row" id="ctl"><button class="btn primary" type="button" id="pruefen">Prüfen</button></div>';
    box.innerHTML = h;
    box.querySelectorAll("[data-w]").forEach(b => b.addEventListener("click", () => {
      const k = b.dataset.w === "end" ? "end" : +b.dataset.w;
      marked.has(k) ? marked.delete(k) : marked.add(k); b.classList.toggle("mark"); b.setAttribute("aria-pressed", marked.has(k));
    }));
    $("#pruefen").addEventListener("click", () => {
      let allOk = true;
      box.querySelectorAll("[data-w]").forEach(b => {
        const k = b.dataset.w === "end" ? "end" : +b.dataset.w; b.disabled = true; b.classList.remove("mark");
        if (wrong.has(k) && marked.has(k)) b.classList.add("r");
        else if (wrong.has(k)) { b.classList.add("miss"); allOk = false; }
        else if (marked.has(k)) { b.classList.add("false"); allOk = false; }
      });
      const keiner = wrong.size === 0;
      let msg = keiner ? (allOk ? "<b>Richtig! Der Satz bleibt.</b>Satzanfang groß, Nomen groß, Punkt am Ende." : "<b>Dieser Satz war schon richtig.</b>Ein richtiger Satz bleibt.")
        : (allOk ? "<b>Richtig! Du hast alle Fehler gefunden.</b>" : "<b>Noch nicht alles.</b>Gestrichelt: übersehen. Durchgestrichen: war schon richtig.");
      $("#fb").innerHTML = '<div class="fb ' + (allOk ? "ok" : "no") + '" role="status">' + msg + '<div style="margin-top:6px">So ist es richtig: <b style="display:inline">' + esc(it.richtig) + '</b></div></div>';
      $("#ctl").innerHTML = '<button class="btn primary block" type="button" id="weiter">' + (i + 1 < u.items.length ? "Nächster Satz" : "Fertig") + '</button>';
      $("#weiter").addEventListener("click", () => { i++; i < u.items.length ? show() : finish(u, box, '<p>Du hast ' + u.items.length + ' Sätze geprüft.</p>'); });
      $("#weiter").scrollIntoView({block: "nearest"});
    });
  }
  show();
}

/* Sätze auswählen */
function exSaetze(u, box){
  const marked = new Set();
  let h = u.saetze.map((s, k) => '<button class="sent" type="button" data-s="' + k + '" aria-pressed="false">' + esc(s.text) + '</button>').join("") + '<div id="fb"></div><div class="row" id="ctl"><button class="btn primary" type="button" id="pruefen">Prüfen</button></div>';
  box.innerHTML = h;
  box.querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", () => { const k = +b.dataset.s; marked.has(k) ? marked.delete(k) : marked.add(k); b.classList.toggle("mark"); b.setAttribute("aria-pressed", marked.has(k)); }));
  $("#pruefen").addEventListener("click", () => {
    let allOk = true;
    box.querySelectorAll("[data-s]").forEach(b => {
      const k = +b.dataset.s, s = u.saetze[k]; b.disabled = true; b.classList.remove("mark");
      if (s.ja && marked.has(k)) b.classList.add("r"); else if (s.ja) { b.classList.add("miss"); allOk = false; } else if (marked.has(k)) allOk = false;
      b.insertAdjacentHTML("beforeend", '<small>' + (marked.has(k) !== s.ja ? "✗ " : "✓ ") + esc(s.erklaerung) + '</small>');
    });
    $("#fb").innerHTML = '<div class="fb ' + (allOk ? "ok" : "no") + '" role="status"><b>' + (allOk ? "Richtig!" : "Noch nicht ganz. Lies die Erklärungen.") + '</b>' + md(u.fazit) + '</div>';
    $("#ctl").innerHTML = '<button class="btn primary block" type="button" id="weiter">Fertig</button>';
    $("#weiter").addEventListener("click", () => finish(u, box, '<p>' + md(u.fazit) + '</p>'));
    $("#fb").scrollIntoView({block: "nearest"});
  });
}

/* ---------- Rätsel ---------- */
let rOrder = null, rIdx = 0;
function viewRaetsel(){
  const W = D.raetsel.woerter; S.raetsel = S.raetsel || {};
  if (!rOrder) { const open = W.map((w, k) => k).filter(k => !S.raetsel[W[k][0]]); rOrder = shuffle(open).concat(shuffle(W.map((w, k) => k).filter(k => S.raetsel[W[k][0]]))); rIdx = 0; }
  const solved = W.filter(w => S.raetsel[w[0]]).length;
  const [wort, hinweis] = W[rOrder[rIdx % rOrder.length]];
  const up = wort.toLocaleUpperCase("de-DE").split("");
  let letters; do { letters = shuffle(up.map((c, k) => ({c, k}))); } while (letters.map(l => l.c).join("") === up.join("") && up.length > 2);
  const fill = [];
  let h = '<h1>Buchstabenrätsel</h1><p class="lead">' + md(D.raetsel.intro) + '</p><div class="prog"><span>' + solved + ' von ' + W.length + ' gelöst</span><span class="bar"><i style="width:' + Math.round(solved / W.length * 100) + '%"></i></span></div>';
  h += '<div class="card"><div class="cardhead"><div style="flex:1"><span class="label">Hinweis</span><div style="font-size:20px">' + md(hinweis) + '</div><div class="small">' + up.length + ' Buchstaben</div></div>' + sayBtn(hinweis) + '</div><div class="slots" id="slots" role="status"></div><div class="letters" id="letters"></div><div id="fb"></div><div class="row" id="ctl" style="justify-content:center"><button class="btn" type="button" id="tipp">Erster Buchstabe</button><button class="btn" type="button" id="zurueck">Zurück</button><button class="btn" type="button" id="leer">Löschen</button><button class="btn ghost" type="button" id="skip">Anderes Wort</button></div></div>';
  const known = W.filter(w => S.raetsel[w[0]]);
  if (known.length) h += '<h2>Deine Fachwörter</h2><div class="card">' + known.map(w => '<p><b>' + esc(w[0]) + '</b> – ' + esc(w[1]) + '</p>').join("") + '</div>';
  M.innerHTML = h;
  function draw(){
    $("#slots").innerHTML = up.map((c, k) => '<span class="slot">' + (fill[k] ? esc(fill[k].c) : "") + '</span>').join("");
    $("#slots").setAttribute("aria-label", "Dein Wort: " + up.map((c, k) => fill[k] ? fill[k].c : "_").join(" "));
    $("#letters").innerHTML = letters.map((l, k) => '<button class="letter" type="button" data-l="' + k + '"' + (fill.includes(l) ? " disabled" : "") + '>' + esc(l.c) + '</button>').join("");
    M.querySelectorAll("[data-l]").forEach(b => b.addEventListener("click", () => { const k = fill.findIndex((f, n) => !f && n < up.length); const pos = k === -1 ? fill.length : k; if (pos >= up.length) return; fill[pos] = letters[+b.dataset.l]; draw(); test(); }));
  }
  function test(){
    if (up.some((c, k) => !fill[k])) return;
    if (fill.map(f => f.c).join("") === up.join("")) {
      S.raetsel[wort] = 1; save();
      $("#letters").innerHTML = ""; 
      $("#fb").innerHTML = '<div class="fb ok" role="status"><b>Richtig: ' + esc(wort) + '</b>' + esc(hinweis) + '<br><span class="small">' + (/^[A-ZÄÖÜ]/.test(wort) && wort !== wort.toUpperCase() ? "Das ist ein Nomen. Du schreibst es groß." : "") + '</span></div>';
      $("#ctl").innerHTML = '<button class="btn primary" type="button" id="next">Nächstes Wort</button>';
      $("#next").addEventListener("click", () => { rIdx++; viewRaetsel(); });
    } else {
      const s = $("#slots"); s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake");
      $("#fb").innerHTML = '<div class="fb no" role="status"><b>Noch nicht.</b>Mit „Zurück“ nimmst du den letzten Buchstaben weg.</div>';
    }
  }
  $("#tipp").addEventListener("click", () => { if (fill[0] && fill[0].fix) return; if (fill[0]) fill[0] = null; const l = letters.find(l => l.c === up[0] && !fill.includes(l)); if (l) { const old = fill.indexOf(l); if (old > -1) fill[old] = null; fill[0] = l; l.fix = true; } $("#fb").innerHTML = ""; draw(); test(); });
  $("#zurueck").addEventListener("click", () => { for (let k = up.length - 1; k >= 0; k--) if (fill[k] && !fill[k].fix) { fill[k] = null; break; } $("#fb").innerHTML = ""; draw(); });
  $("#leer").addEventListener("click", () => { for (let k = 0; k < up.length; k++) if (fill[k] && !fill[k].fix) fill[k] = null; $("#fb").innerHTML = ""; draw(); });
  $("#skip").addEventListener("click", () => { rIdx++; viewRaetsel(); });
  draw();
}

/* ---------- Zuhause ---------- */
function viewZuhause(){
  const Z = D.zuhause;
  let h = '<h1>Zuhause üben</h1><div class="cardhead"><p class="lead" style="flex:1">' + md(Z.intro) + '</p>' + sayBtn(Z.intro) + '</div><div class="ideas">' + Z.ideen.map(t => '<span>' + esc(t) + '</span>').join("") + '</div>';
  Z.schritte.forEach((s, k) => { h += '<section class="card"><div class="cardhead"><h3>' + (k + 1) + ' · ' + esc(s.titel) + '</h3>' + sayBtn(s.titel + ". " + s.text) + '</div><div>' + md(s.text) + '</div></section>'; });
  h += '<section class="card calm"><h3>Sicher üben</h3><ul class="plain">' + Z.sicherheit.map(t => '<li>' + md(t) + '</li>').join("") + '</ul></section>';
  h += '<h2>' + esc(Z.plan.titel) + '</h2><p class="small">' + md(Z.plan.hinweis) + '</p><div class="card">' + Z.plan.felder.map(f => '<div class="field"><label for="pf_' + f[0] + '">' + esc(f[1]) + '</label><textarea id="pf_' + f[0] + '" data-pf="' + f[0] + '" rows="2">' + esc(S.plan[f[0]] || "") + '</textarea></div>').join("") + '<button class="btn ghost" type="button" id="planleer">Plan leeren</button></div>';
  h += '<h2>' + esc(Z.check_titel) + '</h2><div class="card">';
  D.wissen.checkliste.forEach(g => g.teile.forEach(t => { const c = !!S.check[t.titel]; h += '<label class="check' + (c ? " done" : "") + '"><input type="checkbox" data-ck="' + esc(t.titel) + '"' + (c ? " checked" : "") + '><span><b>' + esc(t.titel) + '</b><br><span class="small">' + md(t.text) + '</span></span></label>'; }));
  h += '<button class="btn ghost" type="button" id="checkleer" style="margin-top:8px">Haken entfernen</button></div>';
  M.innerHTML = h;
  M.querySelectorAll("[data-pf]").forEach(t => t.addEventListener("input", () => { S.plan[t.dataset.pf] = t.value; save(); }));
  M.querySelectorAll("[data-ck]").forEach(c => c.addEventListener("change", () => { if (c.checked) S.check[c.dataset.ck] = 1; else delete S.check[c.dataset.ck]; c.closest(".check").classList.toggle("done", c.checked); save(); }));
  $("#planleer").addEventListener("click", () => { if (confirm("Willst du deinen Plan wirklich leeren?")) { S.plan = {}; save(); const y = scrollY; viewZuhause(); scrollTo(0, y); } });
  $("#checkleer").addEventListener("click", () => { S.check = {}; save(); const y = scrollY; viewZuhause(); scrollTo(0, y); });
}

/* ---------- Info ---------- */
function viewInfo(){
  const E = D.elterninfo;
  let h = '<a class="back" href="#/weg"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Zurück</a><h1>' + esc(E.titel) + '</h1><div class="card">' + E.absaetze.map(p => '<p>' + md(p) + '</p>').join("") + '</div>';
  h += '<h2>Gespeicherte Daten</h2><div class="card"><p>Häkchen, gelöste Rätsel und dein Schreibplan liegen nur auf diesem Gerät.</p><button class="btn block" type="button" id="reset">Alles löschen</button></div>';
  h += '<h2>Bildnachweise</h2><div class="card small">' + D.nachweise.map(n => '<p>' + esc(n) + '</p>').join("") + '</div><p class="small">' + esc(D.app.untertitel) + ' · Stand ' + esc(D.stand) + '</p>';
  M.innerHTML = h;
  $("#reset").addEventListener("click", () => {
    if (!confirm("Alle Häkchen, Rätsel und Notizen auf diesem Gerät löschen?")) return;
    S = {weg:{}, ex:{}, raetsel:{}, plan:{}, check:{}}; try { localStorage.removeItem(KEY); } catch(e) {} rOrder = null;
    $("#reset").textContent = "Gelöscht"; $("#reset").disabled = true;
  });
}

route();

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
})();
