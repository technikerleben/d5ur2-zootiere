<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Zootiere · Deutsch 5</title>
<style>
@font-face { font-family: "Andika"; src: url("assets/fonts/andika-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Andika"; src: url("assets/fonts/andika-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: swap; }
:root {
  --blau: #3E5668; --blau-dunkel: #2C3D4C;
  --orange: #D97A4A; --orange-dunkel: #9E4E22;
  --gruen: #4D8B3F;
  --hintergrund: #F5F4F1; --karte: #FFFFFF; --text: #1E2A35; --leise: #5A6873;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
  background: var(--hintergrund); color: var(--text);
  font-family: "Andika", system-ui, sans-serif; font-size: 1.15rem; line-height: 1.5;
}
main {
  width: 100%; max-width: 560px;
  background: var(--karte);
  border-top: 8px solid var(--blau);
  border-radius: 16px;
  padding: 32px 28px 28px;
  box-shadow: 0 6px 24px rgba(44, 61, 76, .12);
}
.kopf { margin: 0 0 4px; color: var(--leise); font-size: .95rem; letter-spacing: .02em; }
h1 { margin: 0 0 20px; color: var(--blau-dunkel); font-size: 1.9rem; line-height: 1.2; }
p { margin: 0 0 16px; }
.knopf {
  display: block; margin: 24px 0 20px; padding: 16px 20px;
  background: var(--orange-dunkel); color: #fff; text-align: center;
  font-weight: 700; font-size: 1.2rem; text-decoration: none;
  border-radius: 12px;
}
.knopf:hover, .knopf:focus-visible { background: var(--blau-dunkel); }
.knopf:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
.hinweis {
  margin: 0; padding: 12px 16px;
  border-left: 4px solid var(--gruen); background: #EEF5EC;
  border-radius: 0 8px 8px 0; font-size: 1rem;
}
</style>
</head>
<body>
<main>
  <p class="kopf">Deutsch · Jahrgang 5 · Zootiere</p>
  <h1>Du möchtest zu Hause lernen?</h1>
  <p>Alles, was du zum Lernen zu Hause brauchst, findest du auf unserer Pinnwand.</p>
  <a class="knopf" href="https://schulendortmund.taskcards.app/#/board/86a516d4-8c24-40f8-9b4e-d3b50587ecbc?token=c62bc016-43cb-4d91-80e5-05c687e62385">Zur Pinnwand</a>
  <p class="hinweis">Im Unterricht arbeitest du mit deinen Blättern und dem Lernbuddy. Diese Seite brauchst du nur zu Hause.</p>
</main>
</body>
</html>
